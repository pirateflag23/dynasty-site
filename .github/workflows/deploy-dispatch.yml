name: Deploy dispatcher

on:
  push:
    branches: [main]
    paths: ["dispatch/**", ".github/workflows/deploy-dispatch.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-dispatch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy odl-dispatch (cron every 10 min)
        working-directory: dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Set GH_TOKEN secret (only when ODL_DISPATCH_PAT exists)
        working-directory: dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAT: ${{ secrets.ODL_DISPATCH_PAT }}
        run: |
          if [ -z "$PAT" ]; then echo "::warning::Add the ODL_DISPATCH_PAT repo secret, then re-run this workflow"; exit 0; fi
          printf '%s' "$PAT" | npx --yes wrangler@4 secret put GH_TOKEN
