name: Deploy bot

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: KV namespace for Pick'em
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find_id() { npx --yes wrangler@4 kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const n=JSON.parse(s).find(x=>x.title==="td-pickem"||x.title.endsWith("-td-pickem"));process.stdout.write(n?n.id:"")}catch{}})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@4 kv namespace create td-pickem >/dev/null; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::Could not create the td-pickem KV namespace"; exit 1; fi
          sed -i "s|\"keep_vars\": true|\"keep_vars\": true,\n  \"kv_namespaces\": [{ \"binding\": \"PICKS\", \"id\": \"$ID\" }]|" wrangler.jsonc
          echo "KV td-pickem = $ID"
      - name: Deploy odl-bot
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
