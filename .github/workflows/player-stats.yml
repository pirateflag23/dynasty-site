name: ODL sync (stats + Discord)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; GitHub may run it a few minutes late
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild player stats even if nothing changed"
        type: boolean
        default: false
      replay:
        description: "Re-post the latest of: final,big,scores,top25,potw,recruiting,portal (comma list) — for testing"
        type: string
        default: ""
      dry_run:
        description: "Print Discord posts in the log instead of posting"
        type: boolean
        default: false
      test_offseason:
        description: "Also write a test copy of the offseason features (data/stories/<league>/offseason-test.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: odl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data/player-stats-all.json
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node .github/workflows/scripts/build-player-stats.mjs
      - name: Build data/rosters-all.json (every player, Roster-tab columns)
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node .github/workflows/scripts/build-rosters.mjs || echo "rosters step failed, continuing"
      - name: Update dynasty history archive
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node .github/workflows/scripts/build-history.mjs
      - name: Write ODL Wire stories
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
          OUTLOOK_TEST: ${{ inputs.test_offseason && '1' || '' }}
        run: node .github/workflows/scripts/build-stories.mjs
      - name: TD Wire AI desk (beat-writer rewrite of the week's stories)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/workflows/scripts/ai-writer.mjs
      - name: Temperature (fan-base thermometer + mock social feeds)
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/workflows/scripts/temperature.mjs || echo "temperature step failed, continuing"
      - name: Temperature photos (kept on the photos branch, only the ones still in use)
        if: ${{ hashFiles('photos-out/*.jpg') != '' }}
        continue-on-error: true
        run: |
          set -e
          LID=$(ls data/stories | grep -E '^[0-9]+$' | head -1)
          KEEP=$(node -e 'const t=require("./data/stories/'"$LID"'/temperature.json");console.log((t.photos||[]).join("\n"))')
          mkdir -p /tmp/ph && cd /tmp/ph && git init -q && git checkout -q -b photos
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin photos && git reset -q --hard origin/photos || true
          cp "$GITHUB_WORKSPACE"/photos-out/*.jpg . 
          for f in *.jpg; do echo "$KEEP" | grep -qx "$f" || rm -f "$f"; done
          git config user.name "td-photos" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "photos $(date -u +%FT%TZ)" --allow-empty
          # one commit, no history: the branch never grows past the current photos
          git checkout -q --orphan fresh && git commit -qm "current temperature photos" && git push -qf origin fresh:photos
          rm -rf "$GITHUB_WORKSPACE/photos-out"
      - name: News archive (keep every story for the News tab)
        run: node .github/workflows/scripts/build-news-archive.mjs
      - name: Register slash commands (only when they change)
        if: ${{ hashFiles('discord.config.json') != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node .github/workflows/scripts/register-commands.mjs
      - name: Install graphics renderer (Top 25 image)
        if: ${{ hashFiles('discord.config.json') != '' }}
        run: npm ci --no-audit --no-fund --prefix .github/workflows/scripts/graphics
      - name: Post to Discord
        if: ${{ hashFiles('discord.config.json') != '' }}
        env:
          DYNASTY_API_KEY: ${{ secrets.DYNASTY_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLAY: ${{ inputs.replay }}
          NSD_TEST: ${{ inputs.test_offseason && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node .github/workflows/scripts/discord-feed.mjs
      - name: Save graphic previews (dry runs)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: graphics-preview
          path: graphics-preview/
          if-no-files-found: ignore
      - name: Commit if changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "No changes"; exit 0; fi
          git config user.name "odl-stats-bot"
          git config user.email "odl-stats-bot@users.noreply.github.com"
          git add data/
          git commit -m "Update ODL data"
          # data files are rebuilt whole each run: on a clash, this run's (newer) copy wins
          git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; } || true
          git push
