<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#cc0000; --red-dark:#a30000;
  --nav:#000000; --nav-2:#1d1e1f; --nav-text:#ffffff; --nav-dim:#a5a6a7;
  --bg:#edeef0; --card:#ffffff; --line:#dcdddf; --line-2:#f1f2f3;
  --text:#121213; --dim:#6c6d6f; --win:#121213; --lose:#9a9b9d;
  --head:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151617; --card:#1f2022; --line:#303235; --line-2:#26282a;
    --text:#ededee; --dim:#9a9b9e; --win:#ffffff; --lose:#7d7e81;
  }
}
:root[data-theme="dark"]{
  --bg:#151617; --card:#1f2022; --line:#303235; --line-2:#26282a;
  --text:#ededee; --dim:#9a9b9e; --win:#ffffff; --lose:#7d7e81;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--body)}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- Top nav ---------- */
.nav{background:var(--nav);color:var(--nav-text);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:30}
.nav-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;height:56px;padding:0 16px;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 22px/1 var(--head);letter-spacing:-.5px;font-style:italic;white-space:nowrap}
.brand-mark{background:var(--red);color:#fff;padding:5px 7px 4px;transform:skewX(-12deg);display:inline-block}
.brand-mark span{display:inline-block;transform:skewX(12deg)}
.brand-logo{height:48px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@media (max-width:560px){.brand-logo{height:40px}.nav-in{gap:10px}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--nav-dim);text-decoration:none;font:700 14px/56px var(--head);padding:0 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}

/* ---------- Scoreboard strip ---------- */
.strip{background:var(--card);border-bottom:1px solid var(--line)}
.strip-in{max-width:1280px;margin:0 auto;display:flex;align-items:stretch}
.strip-label{flex:none;display:flex;flex-direction:column;justify-content:center;padding:8px 16px;border-right:1px solid var(--line);font:700 13px/1.2 var(--head)}
.strip-label small{font:500 11px var(--body);color:var(--dim)}
.strip-games{display:flex;overflow-x:auto;scroll-snap-type:x proximity}
.sb{flex:none;width:176px;padding:8px 12px;border-right:1px solid var(--line);scroll-snap-align:start;text-decoration:none;cursor:default}
.sb-status{font:700 11px var(--body);color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between}
.sb-status .uvu{color:var(--red)}
.sb-row{display:flex;align-items:center;gap:6px;font-size:13px;line-height:22px}
.sb-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-row .sc{font-weight:700;min-width:20px;text-align:right}
.sb-row.lost{color:var(--lose)}
.sb-row.won{color:var(--win);font-weight:700}
.rk{font-size:10px;color:var(--dim);font-weight:500;margin-right:2px}

/* ---------- Layout ---------- */
.demo{background:#fff4d6;color:#5c4400;text-align:center;font-size:12px;padding:6px 12px;border-bottom:1px solid #f0dca0}
main{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr) 300px}.col-left{order:3;grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.col-left{order:2}.col-right{order:3}}
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:16px}
.card-h{font:700 16px/1.2 var(--head);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;margin:0}
.card-h small{font:500 12px var(--body);color:var(--dim)}
.empty{padding:16px 14px;color:var(--dim);font-size:13px}

/* ---------- Team badge ---------- */
.tb{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 9px/1 var(--head);letter-spacing:-.2px}
.tb.lg{width:64px;height:64px;font-size:22px}
img.tb{background:none!important;box-shadow:none!important;border-radius:0;object-fit:contain}

/* ---------- Hero (game of the week) ---------- */
.hero{background:var(--nav-2);color:#fff;border:0}
.hero-tag{background:var(--red);font:800 12px/1 var(--head);padding:7px 14px;font-style:italic;letter-spacing:.2px}
.hero-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:26px 18px 18px}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero-team .n{font:800 22px/1.05 var(--head)}
.hero-team .u{font-size:12px;color:var(--nav-dim)}
.hero-team.lost .n{color:var(--nav-dim)}
.hero-score{font:800 54px/1 var(--head);display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums}
.hero-score .l{color:#6f7073}
.hero-score .f{font:700 12px var(--body);color:var(--nav-dim);display:block;text-align:center;margin-top:6px}
.hero-line{font:700 26px/1.1 var(--head);padding:4px 18px 20px;margin:0}
@media (max-width:520px){.hero-score{font-size:38px;gap:10px}.hero-team .n{font-size:17px}.tb.lg{width:48px;height:48px;font-size:17px}.hero-line{font-size:21px}}

/* ---------- Headlines ---------- */
.hl{list-style:none;margin:0;padding:0}
.hl li{padding:12px 14px;border-top:1px solid var(--line-2)}
.hl li:first-child{border-top:0}
.hl .t{font:700 17px/1.2 var(--head);display:block}
.hl .s{color:var(--dim);font-size:13px;margin-top:3px}
.flag{display:inline-block;font:800 11px/1 var(--head);color:#fff;background:var(--red);padding:3px 5px 2px;margin-right:6px;vertical-align:2px;font-style:italic}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 11px var(--body);color:var(--dim);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 10px;border-top:1px solid var(--line-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.user td{background:color-mix(in srgb,var(--red) 6%,transparent)}
.team-cell{display:flex;align-items:center;gap:8px}
.team-cell .nm{font-weight:500}
.num{color:var(--dim);width:22px;display:inline-block;text-align:right;margin-right:4px;font-weight:700}
.scroll{overflow-x:auto}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}

/* ---------- Lists ---------- */
.lst{list-style:none;margin:0;padding:0}
.heis-win{background:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,#f2b134 20%,transparent),transparent 60%)}
.hw-top{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}.hw-top>div:nth-child(2){flex:1;min-width:0}
.hw-tro{font-size:44px;line-height:1;filter:drop-shadow(0 0 10px rgba(242,177,52,.55))}
.hw-nm{font:800 22px/1.1 var(--head);text-transform:uppercase}.hw-top .b{font-size:12px;color:var(--dim);margin-top:3px}
.hw-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;padding:6px 14px 4px}
.hw-stats>div:not(.hw-line){border:1px solid var(--line);border-top:3px solid #f2b134;border-radius:6px;padding:7px 4px;text-align:center}
.hw-stats b{display:block;font:800 18px var(--head)}.hw-stats small{font:700 10px var(--head);color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.hw-line{grid-column:1/-1;font-size:12px;color:var(--dim)}.hw-foot{font-size:11px;color:var(--dim);padding:6px 14px 12px}
.lst li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line-2)}
.lst li:first-child{border-top:0}
.lst .r{font:800 20px/1 var(--head);color:var(--dim);width:20px;flex:none}
.lst .main{flex:1;min-width:0}
.lst .a{font-weight:700}
.lst .b{font-size:12px;color:var(--dim)}
.mv{font-size:11px;font-weight:700}
.mv.up{color:#0a8a3c}.mv.dn{color:var(--red)}
.kind{font:700 10px/1 var(--body);padding:3px 5px;border-radius:3px;flex:none;margin-top:2px;color:#fff}
.k-commit{background:#0a8a3c}.k-flip{background:#c26a00}.k-decommit{background:var(--red)}.k-sign{background:#2456b3}
.stars{color:#e0a800;letter-spacing:-1px}

/* ---------- Scores page ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:14px}
.g{border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.g .sb-row{font-size:14px;line-height:26px}
.g-meta{font-size:11px;color:var(--dim);margin-top:4px}

/* ---------- Team links & team page ---------- */
.tl{color:inherit;text-decoration:none}
.tl:hover{text-decoration:underline}
.tp-head{background:var(--nav-2);color:#fff;border:0}
.tp-top{display:flex;gap:18px;align-items:center;padding:20px 18px}
.tp-name{font:800 30px/1.05 var(--head);margin:0}
.tp-name small{font:700 18px var(--head);color:var(--nav-dim);margin-left:6px}
.tp-sub{color:var(--nav-dim);font-size:13px;margin-top:4px}
.tp-facts{display:flex;flex-wrap:wrap;border-top:1px solid #333538}
.tp-fact{padding:10px 18px;border-right:1px solid #333538}
.tp-fact b{display:block;font:800 22px/1.1 var(--head);font-variant-numeric:tabular-nums}
.tp-fact span{font-size:11px;color:var(--nav-dim)}
.tp-head.team .tp-sub,.tp-head.team .tp-fact span,.tp-head.team .tp-name small,.tp-head.team .rk{color:inherit!important;opacity:.8}
.tp-head.team .tp-facts,.tp-head.team .tp-fact{border-color:rgba(127,127,127,.35)}
.tp-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.tp-grid{grid-template-columns:minmax(0,1fr)}}
.st2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:560px){.st2{grid-template-columns:1fr}}
.st2 > div + div{border-left:1px solid var(--line)}
@media (max-width:560px){.st2 > div + div{border-left:0;border-top:1px solid var(--line)}}
.st-h{font:700 13px var(--head);padding:10px 14px 4px;color:var(--dim)}
.st-row{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border-top:1px solid var(--line-2)}
.st-row .l{flex:1}
.st-row .v{font:800 17px var(--head);font-variant-numeric:tabular-nums}
.st-row .r{font-size:11px;color:var(--dim);min-width:40px;text-align:right}
.ldr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.ldr > div{padding:12px 14px;border-top:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.ldr .cat{font-size:11px;color:var(--dim);font-weight:700}
.ldr .who{font-weight:700;margin-top:2px}
.ldr .who small{color:var(--dim);font-weight:500}
.ldr .val{font:800 20px/1.2 var(--head);font-variant-numeric:tabular-nums}
.ldr .val small{font:500 12px var(--body);color:var(--dim)}
.res{font-weight:700;width:16px;display:inline-block}
.res.W{color:#0a8a3c}.res.L{color:var(--red)}
details.raw{padding:0 14px 12px;font-size:12px;color:var(--dim)}
details.raw code{word-break:break-all}
/* ---------- Game page ---------- */
[data-game]{cursor:pointer}
.sb[data-game]:hover,.g[data-game]:hover{background:var(--line-2)}
.sb-status a{color:inherit;text-decoration:none}
.sb-status a:hover{text-decoration:underline}
.bx-link{font-size:12px;font-weight:700;color:var(--red);text-decoration:none;margin-left:6px}
.bx-link:hover{text-decoration:underline}
.gh{background:var(--nav-2);color:#fff;border:0}
.gh-bars{display:flex;height:4px}.gh-bars i{flex:1}
.gh-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px 18px}
.gh-team{display:flex;align-items:center;gap:14px}
.gh-team.home{flex-direction:row-reverse;text-align:right}
.gh-team .n{font:800 26px/1.05 var(--head)}
.gh-team .n small{display:block;font:500 12px var(--body);color:var(--nav-dim);margin-top:4px}
.gh-team.lost .n > a,.gh-team.lost .n > span{color:var(--nav-dim)}
.gh-score{text-align:center;font:800 56px/1 var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.gh-score .l{color:#6f7073}
.gh-score .tag{display:inline-block;font:800 11px/1 var(--head);background:var(--red);color:#fff;padding:4px 6px 3px;margin-bottom:8px;font-style:italic}
.gh-score .meta{font:500 12px var(--body);color:var(--nav-dim);margin-top:8px}
@media (max-width:620px){.gh-body{grid-template-columns:1fr;justify-items:center}.gh-team,.gh-team.home{flex-direction:column;text-align:center}.gh-score{font-size:44px;order:-1}}
.gm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.gm-grid{grid-template-columns:minmax(0,1fr)}}
.ls td:last-child,.ls th:last-child{font-weight:800}
.pog li .r{font-size:16px}
.pog .line{font-size:13px;margin-top:2px}
.cmp{padding:4px 14px 12px}
.cmp-row{padding:8px 0 0}
.cmp-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.cmp-top b{font:800 16px var(--head);font-variant-numeric:tabular-nums;min-width:60px}
.cmp-top b:last-child{text-align:right}
.cmp-top span{color:var(--dim);font-size:12px;text-align:center}
.cmp-bar{display:flex;gap:3px;height:5px;margin-top:4px}
.cmp-bar i{display:block;border-radius:2px;min-width:3px}
.bx2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bx2 > div + div{border-left:1px solid var(--line)}
@media (max-width:760px){.bx2{grid-template-columns:minmax(0,1fr)}.bx2 > div + div{border-left:0;border-top:1px solid var(--line)}}
.bx-team{display:flex;align-items:center;gap:8px;padding:9px 10px 4px;font:700 13px var(--head)}
.tbl td.pl{font-weight:500}
.tbl td.pl small{color:var(--dim);font-weight:400;margin-left:4px}
/* ---------- Recruits ---------- */
.rl{color:inherit;text-decoration:none;font-weight:700}
.rl:hover{text-decoration:underline}
.rc-top{display:flex;gap:18px;align-items:center;padding:20px 18px}
.rc-pos{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font:800 18px var(--head)}
.rc-name{font:800 30px/1.05 var(--head);margin:0}
.rc-name .stars{font-size:20px;margin-left:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.facts > div{padding:10px 14px;border-top:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.facts span{display:block;font-size:11px;color:var(--dim)}
.facts b{font:700 16px/1.3 var(--head)}
.deal{margin:12px 14px 14px;padding:10px 12px;border-left:4px solid var(--red);background:color-mix(in srgb,var(--red) 7%,transparent);font-size:13px}
.deal b{display:block;font:800 17px var(--head);margin-top:2px}
.inf{padding:4px 14px 12px}
.inf .b{font-size:12px;color:var(--dim);margin-top:4px}
.facts .stars{font-size:17px;letter-spacing:0}
.inf-row{padding:9px 0;border-top:1px solid var(--line-2)}
.inf-row:first-child{border-top:0}
.inf-top{display:flex;align-items:center;gap:8px}
.inf-top .nm{flex:1;font-weight:700}
.inf-top .pts{font:800 16px var(--head);font-variant-numeric:tabular-nums}
.inf-bar{height:6px;background:var(--line-2);border-radius:3px;margin-top:6px;overflow:hidden}
.inf-bar i{display:block;height:100%;border-radius:3px}
.stage{display:inline-block;font:700 11px/1 var(--body);padding:4px 7px;border-radius:3px;background:var(--line-2);color:var(--text)}
.stage.done{background:#0a8a3c;color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters input,.filters select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text)}
.filters input{flex:1;min-width:160px}
/* ---------- Recruiting section ---------- */
.subnav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:5px;margin-bottom:16px;padding:0 8px;overflow-x:auto}
.subnav h1{font:800 18px/48px var(--head);margin:0 14px 0 6px;white-space:nowrap}
.subnav a{font:700 14px/48px var(--head);padding:0 12px;color:var(--dim);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.subnav a:hover{color:var(--text)}
.subnav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--red)}
.story{background:var(--nav-2);color:#fff;border:0}
.story-body{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 18px}
.story-art{display:flex;align-items:center;gap:10px}
.story-art .rc-pos{width:76px;height:76px;font-size:20px}
.story-art .arrow{font:800 22px var(--head);color:var(--nav-dim)}
.story h1{font:800 30px/1.1 var(--head);margin:0}
.story .deck{color:#c9cacc;font-size:14px;margin-top:8px;max-width:68ch}
.story .when{color:var(--nav-dim);font-size:12px;margin-top:10px}
.story a{color:#fff}
@media (max-width:620px){.story-body{grid-template-columns:1fr}.story h1{font-size:23px}}
.news li{display:flex;gap:12px;align-items:flex-start}
.news .t a{color:inherit}
.news .kind{margin-top:4px}
.wk-h{font:700 12px var(--body);color:var(--dim);padding:10px 14px 4px;background:var(--line-2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.pager:last-child{border-bottom:0;border-top:1px solid var(--line)}
.pager small{color:var(--dim)}
.pill:disabled{opacity:.4;cursor:default}
/* ---------- Player card ---------- */
.pl-link{color:inherit;text-decoration:none}
.pl-link:hover{text-decoration:underline}
.pc-head{border:0;color:#fff}
.pc-top{display:flex;align-items:center;gap:20px;padding:22px 20px}
.pc-num{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25);font:800 34px var(--head);border:2px solid rgba(255,255,255,.35)}
.pc-first{font:700 16px var(--head);opacity:.85}
.pc-last{font:800 44px/1 var(--head);margin:0;letter-spacing:-.5px}
.pc-last small{font-size:20px;opacity:.7;margin-left:6px}
.pc-sub{font:700 15px var(--head);margin-top:6px}
.pc-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;opacity:.85;margin-top:8px}
.pc-ovr{margin-left:auto;text-align:right;padding-left:18px;border-left:1px solid rgba(255,255,255,.3)}
.pc-ovr span{font:700 11px var(--body);opacity:.8;display:block}
.pc-ovr b{font:800 60px/1 var(--head)}
.chip{display:inline-block;font:800 11px/1 var(--head);padding:4px 7px 3px;border-radius:3px;background:rgba(255,255,255,.18);color:#fff;font-style:italic;margin-left:6px;vertical-align:4px}

// recruiting/other endpoints abbreviate: "Xxx St." -> "Xxx State"
const canon = (n = "") => ALIAS[n] || (/ St\.$/.test(n) ? n.replace(/ St\.$/, " State") : n);
const lum = (hex) => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const teamColors = (name = "") => TEAM_COLORS[name] || TEAM_COLORS[canon(name)] || null;
// main brand color; very light primaries (e.g. Purdue gold, Missouri gold, Carolina blue) still read fine with dark text
const teamColor = (name) => teamColors(name)?.[0] || `hsl(${hue(name)} 55% 42%)`;
const teamInk = (name) => { const c = teamColors(name)?.[0]; return c && lum(c) > 0.4 ? "#121213" : "#fff"; };
const teamAccent = (name) => { const c = teamColors(name); if (!c) return "rgba(255,255,255,.35)"; return c[1]; };
const LOGO_BASE = () => CONFIG.API_BASE.replace(/\/$/, "");
const logoUrl = (name) => { const v = D.logos?.[name] ?? D.logos?.[canon(name)]; const n = D.logos?.[name] != null ? name : canon(name);
  return v != null ? `${LOGO_BASE()}/logo/${encodeURIComponent(n)}?v=${v}` : ""; };
const badge = (name, lg) => logoUrl(name) ? `<img class="tb${lg ? " lg" : ""}" src="${esc(logoUrl(name))}" alt="" loading="lazy">` : `<span class="tb${lg ? " lg" : ""}" style="background:${teamColor(name)};color:${teamInk(name)};box-shadow:inset 0 0 0 ${lg ? 3 : 2}px ${teamAccent(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
const rk = (r) => (r > 0 && r <= 25 ? `<span class="rk">${r}</span>` : "");  // only Top 25 ranks are shown
const parseRec = (s = "0-0") => { const [w, l] = String(s).split("-").map(Number); return { w: w || 0, l: l || 0 }; };
const tLink = (name, key) => key ? `<a class="tl" href="#team/${key}">${esc(name)}</a>` : esc(name);
const stars = (n) => `<span class="stars" aria-label="${n} stars">${"★".repeat(n || 0)}</span>`;

let D = {};          // all loaded data
let isDemo = false;

async function api(path) {
  const r = await fetch(CONFIG.API_BASE.replace(/\/$/, "") + "/v1" + path);
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

async function load() {
  if (!CONFIG.API_BASE) { isDemo = true; D = SAMPLE; return; }
  const want = {
    league: "/league", schedule: "/schedule", standings: "/standings",
    heisman: "/awards/heisman", commits: "/recruits/commits", classes: "/recruits/classes",
    teamstats: "/team-stats", members: "/members", history: "/history"
  };
  const keys = Object.keys(want);
  const res = await Promise.allSettled(keys.map((k) => api(want[k])));
  res.forEach((r, i) => {
    D[keys[i]] = r.status === "fulfilled" ? r.value : null;
    if (r.status === "rejected") console.warn(r.reason);
  });
}

/* ---------- derived data ---------- */
const games = () => D.schedule?.data || [];
const standings = () => D.standings?.data || [];
const teamByKey = (key) => standings().find((t) => t.team_key === key);
const teamByName = (n) => standings().find((t) => t.name === n);
const keyFromTeamId = (id) => (D.teamstats?.data || []).find((t) => t.team_id === id)?.team_key;
const teamRec = (key) => standings().find((t) => t.team_key === key)?.record;
const weeks = () => [...new Set(games().map((g) => g.week))].sort((a, b) => a - b);
const latestPlayedWeek = () => { const p = games().filter((g) => g.played).map((g) => g.week); return p.length ? Math.max(...p) : weeks()[0]; };
function weekLabel(w) {
  const g = games().find((x) => x.week === w);
  if (!g) return `Week ${w}`;
  if (g.bowl_name) return g.bowl_name;
  const d = String(g.displayed_week ?? "").trim();
  return /^\d+$/.test(d) ? `Week ${d}` : d || `Week ${w}`;
}
const kindOrder = { user_vs_user: 0, user_vs_cpu: 1, cpu_vs_cpu: 2 };
const rankWeight = (g) => (g.home.rank_at_game || 40) + (g.away.rank_at_game || 40);
const sortGames = (list) => [...list].sort((a, b) => (kindOrder[a.kind] - kindOrder[b.kind]) || (rankWeight(a) - rankWeight(b)));
const coach = (side) => (side.user_id > 0 || (side.user_name && side.user_id !== -1) ? side.user_name : "");

function winnerLoser(g) {
  const homeWon = g.home.score > g.away.score;
  return homeWon ? [g.home, g.away] : [g.away, g.home];
}
function headline(g) {
  const [w0, l0] = winnerLoser(g);
  const t25 = (x) => ({ ...x, rank_at_game: x.rank_at_game > 0 && x.rank_at_game <= 25 ? x.rank_at_game : 0 });
  const w = t25(w0), l = t25(l0);
  const m = w.score - l.score;
  const verb = m <= 3 ? "edges" : m <= 8 ? "holds off" : m <= 16 ? "beats" : m <= 27 ? "rolls past" : "routs";
  const upset = l.rank_at_game > 0 && (!w.rank_at_game || w.rank_at_game > l.rank_at_game);
  const wn = (w.rank_at_game ? `No. ${w.rank_at_game} ` : "") + w.team;
  const ln = (l.rank_at_game ? `No. ${l.rank_at_game} ` : "") + l.team;
  const nm = (s) => (s.rank_at_game ? `No. ${s.rank_at_game} ` : "") + tLink(s.team, s.team_key);
  return { upset, text: `${wn} ${verb} ${ln}, ${w.score}–${l.score}`, html: `${nm(w)} ${verb} ${nm(l)}, ${w.score}–${l.score}`, w, l };
}

// Hero ("Top result") card: Spotlight style. Uses the site's own helpers:
// winnerLoser, headline, badge, rk, tLink, coach, teamRec, teamColor, teamAccent, esc, loadGame, initials.

function heroBadges(g, h, b) {
  const out = [];
  const ra = g.away.rank_at_game, rh = g.home.rank_at_game, ranked = (r) => r > 0 && r <= 25;
  const margin = Math.abs(g.home.score - g.away.score);
  if (g.kind === "user_vs_user") out.push(["gold", "Game of the week"]);
  if (h.upset) out.push(["hot", "Upset"]);
  if (ranked(ra) && ranked(rh)) out.push(["", "Ranked matchup"]);
  const q = b?.Home?.Quarters || [];
  if (q.length > 4 && (q[4] || b.Away.Quarters[4])) out.push(["hot", "Overtime"]);
  if (margin <= 3) out.push(["", "Nail-biter"]);
  if (margin >= 28) out.push(["", "Blowout"]);
  return out.length ? `<div class="hero-badges">${out.map(([c, t]) => `<span class="${c}">${t}</span>`).join("")}</div>` : "";
}

function heroExtra(g, b) {
  if (!b) return "";
  const ot = (b.Home.Quarters || []).length > 4 && (b.Home.Quarters[4] || b.Away.Quarters[4]);
  const qs = (t) => (t.Quarters || []).slice(0, ot ? 5 : 4);
  const ls = `<table class="hero-ls"><tr><th></th>${["1", "2", "3", "4"].concat(ot ? ["OT"] : []).map((x) => `<th>${x}</th>`).join("")}<th>T</th></tr>
    ${[b.Away, b.Home].map((t) => `<tr><td>${esc(t.Abbrev)}</td>${qs(t).map((v) => `<td>${v}</td>`).join("")}<td>${t.Score}</td></tr>`).join("")}</table>`;
  const P = b.Players || [], ab = (p) => (p.Team === g.home.team_key ? b.Home.Abbrev : b.Away.Abbrev);
  const best = (score) => P.filter((p) => score(p.Stats) > 0).sort((x, y) => score(y.Stats) - score(x.Stats))[0];
  const qb = best((s) => s.passYards + 20 * s.passTD - 25 * s.passINT);
  const sk = best((s) => s.rushYards + s.receivingYards + 20 * (s.rushTD + s.receiveTouchdowns));
  const df = best((s) => s.defenseTotalTackles + 4 * s.defenseSacks + 6 * s.defenseInterceptions + 2 * s.defenseTacklesForLoss);
  const pl = (p) => `<a href="#player/${p.Key}">${esc(p.Name)}</a> <span>${esc(ab(p))}</span>`;
  const cell = (label, p, line) => (p ? `<div><small>${label}</small><b>${pl(p)}</b><span>${line(p.Stats)}</span></div>` : "");
  const pog = [
    cell("Passing", qb, (s) => `${s.passCompletion}/${s.passAttempts}, ${s.passYards} yds, ${s.passTD} TD`),
    cell(sk && sk.Stats.receivingYards > sk.Stats.rushYards ? "Receiving" : "Rushing", sk, (s) => (s.receivingYards > s.rushYards ? `${s.receiveReceptions} rec, ${s.receivingYards} yds, ${s.receiveTouchdowns} TD` : `${s.rushAttempts} car, ${s.rushYards} yds, ${s.rushTD} TD`)),
    cell("Defense", df, (s) => [`${s.defenseTotalTackles} tkl`, s.defenseSacks && `${s.defenseSacks} sk`, s.defenseInterceptions && `${s.defenseInterceptions} INT`].filter(Boolean).join(", ")),
  ].join("");
  return `<div class="hero-extra">${ls}<div class="hero-pog">${pog}</div></div>`;
}

function heroCard(g) {

    const side = (s) => `<div class="hero-team ${g.played && s !== w ? "lost" : ""}">${badge(s.team, true)}

// Adds the line score, players of the game, OT badge and (for Spotlight) a stadium photo if one exists.
async function heroEnrich(g) {
  const el = document.getElementById("hero"); if (!el) return;
  if (g.has_box_score) {
    const full = await loadGame(g).catch(() => null);
    const b = full?.box_score;
    if (b && document.getElementById("hero")) {
      document.getElementById("hero-extra").innerHTML = heroExtra(g, b);
      document.getElementById("hero-badges").innerHTML = heroBadges(g, headline(g), b);
    }
  }
  if (el.classList.contains("v-spot")) {
    const slug = (s) => s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const src = `img/stadiums/${slug(g.home.team)}.jpg`;
    const img = new Image();
    img.onload = () => { const bg = el.querySelector(".bg"); if (bg) { bg.style.backgroundImage = `url("${src}")`; el.classList.add("has-photo"); } };
    img.src = src;
  }
}

/* ----- league stories: templates, rebuilt from the data every sync ----- */
function buildStories(boxes) {
  const out = [], w = latestPlayedWeek();
  const add = (o) => out.push(o);
  const pick = (seed, arr) => arr[hue(String(seed)) % arr.length];
  const wk = games().filter((g) => g.week === w && g.played && g.kind !== "cpu_vs_cpu");
  const recOf = (k) => teamRec(k) || "";
  for (const g of wk) {
    const [W, L] = winnerLoser(g), margin = W.score - L.score, homeLoss = L === g.home;
    const bs = boxes[g.key]?.box_score, side = (s) => (bs ? (s === g.home ? bs.Home : bs.Away)?.Stats || {} : {});
    const ls = side(L), ws = side(W), lc = coach(L), wc = coach(W);
    const sc = `${W.score}–${L.score}`;
    if (g.kind === "user_vs_user") {
      add({ id: g.key + "h2h", type: "h2h", scene: "versus", team: W.team, team2: L.team, score: 90, kick: "Head to head",
        h: pick(g.key, [`${wc} claims bragging rights over ${lc} as ${W.team} tops ${L.team}, ${sc}`, `${W.team} wins the league showdown, ${sc}, and ${wc} won't let ${lc} forget it`, `${wc} gets the better of ${lc} in a ${margin <= 7 ? "nail-biter" : "statement"} ${sc} win`]),
        d: bs && ws.offYardsGained != null ? (ws.offYardsGained >= ls.offYardsGained ? `${W.team} outgained ${L.team} ${ws.offYardsGained} to ${ls.offYardsGained}.` : `${W.team} won despite being outgained ${ls.offYardsGained} to ${ws.offYardsGained}.`) : "" });
    }
    // hot seat for a league coach who lost
    if (lc) {
      const rec = parseRec(recOf(L.team_key)), wRanked = W.rank_at_game > 0 && W.rank_at_game <= 25;
      const bad = rec.l >= rec.w || margin >= 21 || (!wRanked && (homeLoss || margin >= 14));
      if (bad) {
        const oppRush = ws.offRushYards, oppPass = ws.offPassYards, to = ls.turnovers;
        const detail = oppRush >= 200 ? `giving up ${oppRush} yards on the ground` : to >= 3 ? `turning it over ${to} times` : oppPass >= 300 ? `getting torched for ${oppPass} passing yards` : margin >= 21 ? `losing by ${margin}` : `dropping to ${recOf(L.team_key)}`;
        add({ id: g.key + "hot", type: "hotseat", scene: "coach", team: L.team, score: 60 + (homeLoss ? 10 : 0) + (rec.l > rec.w ? 15 : 0) + Math.min(margin, 30), kick: "Hot seat",
          h: pick(g.key + "h", [`Coach ${lc} is firmly on the hot seat after the ${homeLoss ? "home " : ""}loss to ${W.team}, ${detail}`,
            `Boosters restless: ${L.team} falls to ${W.team} ${sc}, ${detail}`, `Pressure mounts on ${lc} after ${L.team} stumbles ${homeLoss ? "at home " : ""}against ${W.team}`,
            `Is it time to worry in ${L.team}? ${lc}'s squad drops a ${sc} decision to ${W.team}`]),
          d: `${L.team} is now ${recOf(L.team_key) || "—"}.${bs && ls.offYardsGained != null && ls.offYardsGained < 300 ? ` Managed just ${ls.offYardsGained} yards of offense.` : ""}` });
      }
    }
    // statement win for a league coach
    if (wc && (L.rank_at_game > 0 && L.rank_at_game <= 25 || margin >= 28) && g.kind !== "user_vs_user") {
      const ranked = L.rank_at_game > 0 && L.rank_at_game <= 25;
      add({ id: g.key + "win", type: "win", scene: ranked ? "scoreboard" : "football", team: W.team, score: ranked ? 80 : 55, kick: ranked ? "Statement win" : "Blowout",
        h: ranked ? pick(g.key + "w", [`${W.team} knocks off No. ${L.rank_at_game} ${L.team}, ${sc}, and ${wc} has the league's attention`, `Statement made: ${wc}'s ${W.team} takes down No. ${L.rank_at_game} ${L.team}`])
          : pick(g.key + "w", [`${W.team} runs ${L.team} off the field, ${sc}`, `No mercy: ${wc}'s ${W.team} rolls ${L.team} by ${margin}`]),
        d: bs ? `${ws.offRushYards ?? 0} rushing yards and ${ws.offPassYards ?? 0} passing yards on the day.` : `${W.team} improves to ${recOf(W.team_key)}.` });
    }
    // defense
    if (wc && L.score <= 10) add({ id: g.key + "def", type: "defense", scene: "helmet", team: W.team, score: 45 + (10 - L.score) * 2, kick: "Defense",
      h: pick(g.key + "d", [`${W.team}'s defense smothers ${L.team}, allowing just ${L.score} points`, `Lockdown: ${W.team} holds ${L.team} to ${L.score}`]),
      d: bs ? `${L.team} was held to ${ls.offYardsGained ?? "—"} total yards and went ${ls.thirdDownConversions ?? 0}-of-${ls.thirdDowns ?? 0} on third down.` : "" });
    // big individual games from the box score (league-team players only)
    if (bs) for (const pl of bs.Players || []) {
      const st = pl.Stats || {}, t = pl.Team === g.home.team_key ? g.home : g.away, o = t === g.home ? g.away : g.home;
      if (!coach(t)) continue;
      const nm = pl.Name;
      if (st.passYards >= 300 || st.passTD >= 4) add({ id: pl.Key + "p" + g.key, type: "performer", scene: "helmet", team: t.team, score: 50 + st.passYards / 20 + st.passTD * 4, kick: "Big game",
        h: pick(pl.Key, [`${nm} carves up ${o.team} for ${st.passYards} yards and ${st.passTD} touchdowns`, `${nm} puts on an aerial show against ${o.team}: ${st.passYards} yards, ${st.passTD} TD`]), d: `${st.passCompletion}/${st.passAttempts} passing for ${t.team}.` });
      if (st.rushYards >= 150) add({ id: pl.Key + "r" + g.key, type: "performer", scene: "helmet", team: t.team, score: 48 + st.rushYards / 10, kick: "Big game",
        h: pick(pl.Key, [`${nm} gashes ${o.team} for ${st.rushYards} rushing yards`, `Workhorse: ${nm} piles up ${st.rushYards} yards on ${st.rushAttempts} carries vs ${o.team}`]), d: `${st.rushTD || 0} rushing TD for ${t.team}.` });
      if (st.receivingYards >= 150) add({ id: pl.Key + "c" + g.key, type: "performer", scene: "helmet", team: t.team, score: 46 + st.receivingYards / 10, kick: "Big game",
        h: `${nm} torches ${o.team}'s secondary for ${st.receivingYards} receiving yards`, d: `${st.receiveReceptions} catches, ${st.receiveTouchdowns || 0} TD.` });
      if (st.defenseSacks >= 3 || st.defenseInterceptions >= 2) add({ id: pl.Key + "x" + g.key, type: "performer", scene: "helmet", team: t.team, score: 52, kick: "Defensive star",
        h: st.defenseSacks >= 3 ? `${nm} lives in the backfield with ${st.defenseSacks} sacks against ${o.team}` : `${nm} picks off ${o.team} ${st.defenseInterceptions} times`, d: `${st.defenseTotalTackles || 0} total tackles.` });
    }
  }
  // perfect seasons among league teams
  for (const t of standings().filter((x) => x.user_controlled && x.losses === 0 && x.wins >= 3)) {
    const c = (D.members?.data || []).find((m) => m.team_key === t.team_key)?.user_name;
    add({ id: t.team_key + "perfect" + w, type: "perfect", scene: "trophy", team: t.name, score: 40 + t.wins * 4, kick: "Still perfect",
      h: pick(t.team_key + w, [`${c ? c + " and " : ""}${t.name} still perfect at ${t.record}`, `Unbeaten ${t.name} (${t.record}) keeps rolling`, `How long can ${t.name} stay perfect? ${t.record} and counting`]),
      d: t.rank > 0 && t.rank <= 25 ? `Ranked No. ${t.rank}.` : "Still outside the Top 25." });
  }
  // heisman
  const hz = D.heisman?.data || [];
  const hu = hz.find((p) => p.user_team);
  const hwin = heismanWinners()[0], hcp = D.league?.data?.current_period || {};
  if (hwin && +hwin.season === +hcp.season) add({ id: hwin.name + "heiswin" + hwin.season, type: "heisman", scene: "trophy", team: hwin.team?.name, score: 90, kick: "Heisman Trophy",
    h: `${hwin.team?.name}'s ${hwin.name} wins the ${hwin.season} Heisman Trophy`, d: `${hwin.position} · ${hwin.team?.name}` });
  else if (hu) add({ id: hu.player_key + "heis" + w, type: "heisman", scene: "trophy", team: hu.team_name, score: 70 - hu.rank * 5, kick: "Heisman watch",
    h: `${hu.name} sits at No. ${hu.rank} in the Heisman race`, d: hu.stat_line || "" });
  else if (hz[0]) add({ id: hz[0].player_key + "heis" + w, type: "heisman", scene: "trophy", team: hz[0].team_name, score: 25, kick: "Heisman watch",
    h: `${hz[0].team_name}'s ${hz[0].name} leads the Heisman race`, d: hz[0].stat_line || "" });
  // recruiting: best commit/flip to a league school in the newest period
  const ev = D.commits?.data || [], latest = ev[0]?.period_id;
  const big = ev.filter((e) => e.period_id === latest && e.kind === "commit" && isUserSchool(e.school?.name)).sort((a, b) => (b.stars - a.stars) || (a.national_rank - b.national_rank))[0];
  if (big) { const c = coachOf(big.school.name);
    add({ id: big.prospect_key + "rec", type: "recruit", scene: "helmet", team: big.school.name, score: 35 + big.stars * 6, kick: big.previous_school ? "Flip" : "Recruiting",
      h: big.previous_school ? `${c || big.school.name} flips ${starWord(big.stars)} ${big.position} ${big.name} away from ${big.previous_school}` : `${c ? c + " lands" : big.school.name + " lands"} ${starWord(big.stars)} ${big.position} ${big.name}`,
      d: `No. ${big.national_rank} prospect nationally.` }); }
  // next week's head-to-head preview
  const nx = games().filter((g) => !g.played && g.kind === "user_vs_user").sort((a, b) => a.week - b.week)[0];
  if (nx) add({ id: nx.key + "pre", type: "preview", scene: "versus", team: nx.away.team, team2: nx.home.team, score: 50, kick: "Circle it",
    h: pick(nx.key, [`Circle it: ${coach(nx.away)} brings ${nx.away.team} to ${nx.home.team} to face ${coach(nx.home)} in ${weekLabel(nx.week)}`, `${weekLabel(nx.week)} showdown: ${nx.away.team} at ${nx.home.team}, ${coach(nx.away)} vs ${coach(nx.home)}`]),
    d: `${nx.away.team} ${recOf(nx.away.team_key)} · ${nx.home.team} ${recOf(nx.home.team_key)}` });
  // best five, at most two per story type
  const seen = {}; return out.sort((a, b) => b.score - a.score).filter((st) => (seen[st.type] = (seen[st.type] || 0) + 1) <= 2).slice(0, 4);
}

function heismanTiles(pos = "", s = {}) {
  const n = (v) => (v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 1 }));
  const p = String(pos).toUpperCase(), t = [], add = (l, v, keep = true) => { if (keep && v != null) t.push([l, n(v)]); };
  if (p === "QB") { add("Pass yds", s.passYards); add("Pass TD", s.passTD); add("INT", s.passINT); add("Rush yds", s.rushYards, s.rushYards > 150); }
  else if (/^(HB|RB|FB)$/.test(p)) { add("Rush yds", s.rushYards); add("Rush TD", s.rushTD); add("Yds/carry", s.rushAvg); add("Rec yds", s.receivingYards, s.receivingYards > 100); }
  else if (/^(WR|TE)$/.test(p)) { add("Rec", s.receiveReceptions); add("Rec yds", s.receivingYards); add("Rec TD", s.receiveTouchdowns); add("Yds/game", s.receiveYardsPerGame); }
  else if (/^(K|P)$/.test(p)) { add("FG made", s.kickFieldGoalsMade); add("FG %", s.kickFieldGoalPercentage); add("Long", s.kickFieldGoalLong); }
  else { add("Tackles", s.defenseTotalTackles); add("TFL", s.defenseTacklesForLoss); add("Sacks", s.defenseSacks); add("INT", s.defenseInterceptions); }
  return t.slice(0, 4);
}

const pickT = (seed, list) => list[hue(String(seed)) % list.length];
const starWord = (n) => ({ 5: "five-star", 4: "four-star", 3: "three-star", 2: "two-star", 1: "one-star" }[n] || "");
const isUserSchool = (name) => !!(teamByName(name)?.user_controlled || (D.classes?.data || []).find((c) => c.name === name)?.user_team);
const coachOf = (name) => { const t = teamByName(name); return t && ((D.members?.data || []).find((m) => m.team_key === t.team_key)?.user_name); };

function storyScore(e) {
  const r = e.national_rank || 999;
  return (e.stars || 0) * 20 + (r <= 10 ? 35 : r <= 25 ? 25 : r <= 50 ? 15 : r <= 100 ? 6 : 0)
    + (e.kind === "commit" && e.previous_school ? 25 : 0) + (e.kind === "decommit" ? 12 : 0) + (e.kind === "sign" ? -6 : 0)
    + (isUserSchool(e.school?.name) || isUserSchool(e.previous_school) ? 15 : 0);
}

function newsHeadline(e) {
  const sch = e.school ? schoolLink(e.school) : "", prevName = e.previous_school || "";
  const prev = prevName ? tLink(prevName, teamByName(prevName)?.team_key) : "";
  const nm = rLink(e.name, e.prospect_key), pos = esc(e.position), sw = starWord(e.stars), no = e.national_rank ? `No. ${e.national_rank}` : "";
  const elite = e.stars >= 5 || (e.national_rank && e.national_rank <= 25);
  const portal = e.transfer;
  let tag, list;
  if (e.kind === "commit" && prevName) {
    tag = ["Flip", "k-flip"];
    list = [`${sch} flips ${sw} ${pos} ${nm} from ${prev}`, `${nm} flips from ${prev} to ${sch}`, `${sch} steals ${sw} ${pos} ${nm} away from ${prev}`, `${prev} loses ${nm} to ${sch} in a late flip`];
  } else if (e.kind === "commit") {
    tag = ["Commit", "k-commit"];
    list = portal ? [`${sch} lands ${sw} transfer ${pos} ${nm}`, `Portal pickup: ${pos} ${nm} heads to ${sch}`]
      : elite ? [`Breaking: ${no} overall ${nm} commits to ${sch}`, `${sch} lands ${sw} ${pos} ${nm}`, `Big get: ${sch} reels in ${no} prospect ${nm}`, `${nm}, the nation's ${no} recruit, picks ${sch}`]
      : e.stars === 4 ? [`${sch} adds ${sw} ${pos} ${nm}`, `${nm}, a ${sw} ${pos}, commits to ${sch}`, `${sch} picks up a ${sw} pledge from ${pos} ${nm}`]
      : [`${sch} picks up commitment from ${pos} ${nm}`, `${pos} ${nm} commits to ${sch}`];
  } else if (e.kind === "decommit") {
    tag = ["Decommit", "k-decommit"];
    list = elite ? [`Blow to ${prev}: ${no} overall ${nm} decommits`, `${sw} ${pos} ${nm} backs off his ${prev} pledge`]
      : [`${nm} reopens recruitment, leaving ${prev}`, `${prev} loses ${sw} ${pos} ${nm}`, `${pos} ${nm} decommits from ${prev}`];
  } else {
    tag = ["Signed", "k-sign"];
    list = elite ? [`It's official: ${no} overall ${nm} signs with ${sch}`, `${sch} seals the deal with ${sw} ${pos} ${nm}`]
      : [`${nm} makes it official with ${sch}`, `${sch} signs ${sw} ${pos} ${nm}`];
  }
  let h = pickT(e.prospect_key + e.kind, list).replace(/\s+/g, " ");
  h = h.charAt(0).toUpperCase() + h.slice(1);
  return { tag, html: h };
}
function newsDeck(e, r) {
  const parts = [];
  if (r) parts.push(`${esc([r.archetype, r.position].filter(Boolean).join(" "))}${r.hometown ? " from " + esc(r.hometown + ", " + r.state) : ""}. No. ${r.position_rank} at his position, No. ${r.state_rank} in ${esc(r.state)}.`);
  else if (e.national_rank) parts.push(`${starWord(e.stars)} ${esc(e.position)}, No. ${e.national_rank} nationally.`);
  const to = e.school?.name, from = e.previous_school;
  if (e.kind === "commit" && to && isUserSchool(to) && coachOf(to)) parts.push(`A win on the trail for ${esc(coachOf(to))}.`);
  if (from && isUserSchool(from) && coachOf(from)) parts.push(`${esc(coachOf(from))} has work to do.`);
  if (r && r.dealbreaker && e.kind !== "sign") parts.push(`Dealbreaker: ${esc(r.dealbreaker)}.`);
  return parts.join(" ");
}

function renderRecruitNews(nav) {

    if (!location.hash.match(/^#recruiting\/?$/)) return;
    const latest = ev[0]?.period_id;
    const hero = [...ev.filter((e) => e.period_id === latest)].sort((a, b) => storyScore(b) - storyScore(a))[0];
    const rest = ev.filter((e) => e !== hero);
    const groups = []; for (const e of rest) { const g = groups[groups.length - 1]; if (g && g.k === e.season_text) g.items.push(e); else groups.push({ k: e.season_text, items: [e] }); }
    const heroHtml = hero ? (() => {
      const h = newsHeadline(hero), r = rmap?.[hero.prospect_key];
      return `<section class="card story"><div class="hero-tag">${h.tag[0] === "Flip" ? "Flip alert" : h.tag[0] === "Decommit" ? "Recruiting shake-up" : "Top recruiting story"}</div>

      </div><div>

          ${cls.length ? `<table class="tbl"><tbody>${cls.map((c) => `<tr class="${c.user_team ? "user" : ""}"><td><div class="team-cell"><span class="num">${c.rank}</span>${badge(c.name)}<span class="nm">${tLink(c.name, c.team_key)}</span></div></td><td>${c.commits?.total ?? 0} commits</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Not synced yet.</div>'}</section>
        <section class="card"><h2 class="card-h">Five-stars still available <small><a class="tl" href="#recruiting/board">Database</a></small></h2>

      </div>

        ${list.map((c) => `<tr class="${c.user_team ? "user" : ""}"><td><div class="team-cell"><span class="num">${showConf ? c.conf_rank : c.rank}</span>${badge(c.name)}<span class="nm">${tLink(c.name, c.team_key)}</span></div></td>

          <td><b>${c.commits?.total ?? 0}</b></td><td>${c.nil_committed != null ? c.nil_committed.toLocaleString() : "—"}</td></tr>`).join("")}
      </tbody></table></div>` : '<div class="empty">No classes for this filter yet.</div>'}`;
    document.querySelectorAll("[data-ct]").forEach((b) => b.onclick = () => { clsState.type = b.dataset.ct; renderClasses(nav); });

// searchable recruit board
const BOARD_MAX = 300, BOARD_PAGE = 50;
/* My board: starred recruits, saved in this browser only (no login). */
const STAR_KEY = "td-starred-recruits";
const starSet = () => { try { return new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]")); } catch { return new Set(); } };
const isStarred = (k) => starSet().has(+k);
function toggleStar(k) { const s = starSet(); k = +k; s.has(k) ? s.delete(k) : s.add(k); try { localStorage.setItem(STAR_KEY, JSON.stringify([...s])); } catch { /* storage off */ } return s.has(k); }
const starBtn = (k, big) => `<button type="button" class="rstar${big ? " big" : ""}" data-star="${k}" aria-pressed="${isStarred(k)}" aria-label="${isStarred(k) ? "Remove from" : "Add to"} My board" title="${isStarred(k) ? "On My board" : "Add to My board"}">${isStarred(k) ? "★" : "☆"}</button>`;
// one delegated handler for every star button on the site
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-star]"); if (!b) return;
  ev.preventDefault(); ev.stopPropagation();
  const on = toggleStar(b.dataset.star);
  document.querySelectorAll(`[data-star="${b.dataset.star}"]`).forEach((x) => { x.textContent = on ? "★" : "☆"; x.setAttribute("aria-pressed", on); x.title = on ? "On My board" : "Add to My board"; x.setAttribute("aria-label", `${on ? "Remove from" : "Add to"} My board`); });
  const mb = $("#rb-mine-n"); if (mb) mb.textContent = starSet().size;
  if (rbState.mine && $("#rb-rows") && rbState._redraw) rbState._redraw();
});
let rbState = { q: "", pos: "", stars: "", status: "", state: "", cls: "", page: 0, mine: false };
function recruitBoardHtml(list) {
  const posOpts = [...new Set(list.map((r) => r.position))].sort();

  return `<div class="filters">
      <input id="rb-q" type="search" placeholder="Search name or hometown" value="${esc(rbState.q)}" aria-label="Search recruits">
      ${sel("rb-pos", "All positions", posOpts, rbState.pos)}${sel("rb-stars", "All stars", [5, 4, 3, 2, 1], rbState.stars)}
      ${sel("rb-state", "All states", stOpts, rbState.state)}${sel("rb-cls", "Any class", ["HS", "JUCO", "JUCO (FR)", "JUCO (SO)", "JUCO (JR)"], rbState.cls)}${sel("rb-status", "Any status", ["Uncommitted", "Committed"], rbState.status)}

function recruitRows(list) {
  const q = rbState.q.toLowerCase();

  const rows = list.filter((r) => (!mine || mine.has(r.prospect_key)) && (!q || `${r.first_name} ${r.last_name} ${r.name} ${r.hometown}`.toLowerCase().includes(q))
    && (!rbState.pos || r.position === rbState.pos) && (!rbState.stars || String(r.stars) === rbState.stars) && (!rbState.state || r.state === rbState.state)
    && (!rbState.status || (rbState.status === "Committed") === !!r.committed)
    && (!rbState.cls || (rbState.cls === "JUCO" ? classLabel(r.class).startsWith("JUCO") : classLabel(r.class) === rbState.cls)));
  const held = rows.slice(0, BOARD_MAX), pages = Math.max(1, Math.ceil(held.length / BOARD_PAGE));

    </tbody></table></div>${pager}`
    : `<div class="empty">${rbState.mine ? (starSet().size ? "None of your starred recruits match these filters." : "Your board is empty. Tap ☆ next to any recruit to add him.") : "No recruits match these filters."}</div>`;
}

/* ---------- team page ---------- */
const norm = (k) => String(k).toLowerCase().replace(/[^a-z0-9]/g, "");
// Find a stat by trying exact names first, then a pattern; returns {key, val}
function statKey(keys, exact, re, not) {
  const map = Object.fromEntries(keys.map((k) => [norm(k), k]));
  for (const e of exact) if (map[norm(e)]) return map[norm(e)];
  return keys.find((k) => re && re.test(norm(k)) && !(not && not.test(norm(k))));
}
const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
const f1 = (v) => (v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1));
const ord = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

// Team metrics from /team-stats (cumulative season totals)
function teamMetrics(t) {
  const s = t?.stats || {}, k = Object.keys(s), gp = t?.games_played || 0;
  const get = (exact, re, not) => num(s[statKey(k, exact, re, not)]);
  const perGame = (pgNames, totNames) => { const pg = get(pgNames); if (pg != null) return pg; const tot = get(totNames); return tot != null && gp ? tot / gp : null; };
  // 3rd down %
  let third = get(["ThirdDownPct", "ThirdDownPercent", "ThirdDownPercentage", "ThirdDownConversionPct", "ThirdDownConvPct"], /^thirddown.*(pct|perc)/);
  if (third == null) {
    const made = get(["ThirdDownConversions", "ThirdDownConv", "ThirdDownMade", "ThirdDownConverted"], /^thirddown.*(conv|made|success)/, /(att|pct|perc)/);
    const att = get(["ThirdDownAttempts", "ThirdDownAtt", "ThirdDowns"], /^thirddown.*att/);
    if (made != null && att) third = (made / att) * 100;
  } else if (third <= 1) third *= 100;
  // turnover margin
  let to = get(["TurnoverMargin", "TurnoverDiff", "TurnoverDifferential", "TurnoversMargin"], /^turnover.*(margin|diff)/);
  if (to == null) {
    const gained = get(["TurnoversGained", "TurnoverGained", "TurnoversForced", "Takeaways"], /^turnover.*(gain|forc|take)/)
      ?? (get(["DefInterceptions"]) != null ? (get(["DefInterceptions"]) || 0) + (get(["DefFumbles", "DefFumblesRecovered"]) || 0) : null);
    const lost = get(["TurnoversLost", "TurnoverLost", "TurnoversGiven", "TurnoverGiven", "Giveaways", "OffTurnovers"], /^turnover.*(lost|given|give)/);
    if (gained != null && lost != null) to = gained - lost;
  }
  return {
    ppg: perGame(["OffPointsPerGame"], ["OffPoints"]),
    ypg: perGame(["OffYardsPerGame"], ["OffTotalYards"]),
    passYpg: perGame(["OffPassYardsPerGame"], ["OffPassYards"]),
    rushYpg: perGame(["OffRushYardsPerGame"], ["OffRushYards"]),
    third, to,
    papg: perGame(["DefPointsPerGame"], ["DefPointsAllowed"]),
    yapg: perGame(["DefYardsPerGame"], ["DefTotalYards"]),
    passApg: perGame(["DefPassYardsPerGame"], ["DefPassYards"]),
    rushApg: perGame(["DefRushYardsPerGame"], ["DefRushYards"]),
  };
}
function metricRank(field, value, higherBetter) {
  if (value == null) return "";
  const all = (D.teamstats?.data || []).map((t) => teamMetrics(t)[field]).filter((v) => v != null);
  if (all.length < 2) return "";
  return ord(1 + all.filter((v) => (higherBetter ? v > value : v < value)).length);
}

// Player stat leaders from /player-stats?team=KEY
const LEADERS = [
  { cat: "Passing", yds: [["passYards", "passYds", "passingYards", "passYdsTotal"], /^pass.*y(ar)?ds?$/, /(allow|att|long|lng)/], td: [["passTDs", "passTD", "passingTDs", "passTouchdowns"], /^pass.*(td|touchdown)s?$/] },
  { cat: "Rushing", yds: [["rushYards", "rushYds", "rushingYards"], /^rush.*y(ar)?ds?$/, /(allow|long|lng|after)/], td: [["rushTDs", "rushTD", "rushingTDs", "rushTouchdowns"], /^rush.*(td|touchdown)s?$/] },
  { cat: "Receiving", yds: [["receivingYards", "recYds", "recYards"], /^rec.*y(ar)?ds?$/, /(long|lng|after|pergame)/], td: [["receiveTouchdowns", "recTDs", "recTD"], /^rec.*(td|touchdown)s?$/] },
  { cat: "Tackles", one: [["defenseTotalTackles", "defTackles", "tackles", "totalTackles"], /^def.*totaltackles$/], unit: "TKL" },
  { cat: "Interceptions", one: [["defenseInterceptions", "defInts", "defInterceptions"], /^def(ense)?interceptions$/], unit: "INT" },
  { cat: "Sacks", one: [["defenseSacks", "defSacks", "sacks"], /^def(ense)?sacks$/], unit: "SCK" },
];
const playerCache = {};
async function teamPlayers(key) {
  if (isDemo) return SAMPLE.players.filter((p) => p.team_key === key);

  return playerCache[key];
}
function leadersHtml(players) {
  const keys = [...new Set(players.flatMap((p) => Object.keys(p.stats || {})))];
  let found = 0;
  const cells = LEADERS.map((L) => {
    const main = statKey(keys, ...(L.yds || L.one));
    const tdKey = L.td ? statKey(keys, ...L.td) : null;
    if (!main) return `<div><div class="cat">${L.cat}</div><div class="b">—</div></div>`;
    found++;
    const best = players.filter((p) => num(p.stats?.[main]) > 0).sort((a, b) => b.stats[main] - a.stats[main])[0];
    if (!best) return `<div><div class="cat">${L.cat}</div><div class="b">No stats yet</div></div>`;
    const v = best.stats[main];
    const val = L.yds ? `${Math.round(v).toLocaleString()} <small>YDS</small>${tdKey ? ` ${best.stats[tdKey] ?? 0} <small>TD</small>` : ""}`
                      : `${Number.isInteger(v) ? v : f1(v)} <small>${L.unit}</small>`;
    return `<div><div class="cat">${L.cat}</div><div class="who">${plLink(best.name, best.player_key)} <small>${esc(best.position)}${best.jersey != null ? " #" + best.jersey : ""}</small></div><div class="val">${val}</div></div>`;
  }).join("");
  const raw = found < LEADERS.length && keys.length
    ? `<details class="raw"><summary>Some stat names weren't recognized. Show the names this API uses</summary><code>${esc(keys.sort().join(", "))}</code></details>` : "";
  return `<div class="ldr">${cells}</div>${raw}`;
}

const gameCache = {};
function loadGame(g) {
  if (isDemo) return Promise.resolve({ ...g, box_score: g.has_box_score ? sampleBox(g) : null });
  if (!gameCache[g.key]) gameCache[g.key] = api(`/games/${g.key}?season=${g.season || D.schedule?.season || ""}`).then((r) => r.data).catch(() => g);
  return gameCache[g.key];
}
const mmss = (sec) => (sec == null ? "—" : `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function playerScore(st) {
  const v = (k) => st[k] || 0;
  return v("passYards") * 0.04 + v("passTD") * 4 - v("passINT") * 2 + v("rushYards") * 0.1 + v("rushTD") * 6
    + v("receivingYards") * 0.1 + v("receiveTouchdowns") * 6 + v("receiveReceptions") * 0.5
    + v("defenseTotalTackles") + v("defenseTacklesForLoss") * 1.5 + v("defenseSacks") * 4 + v("defenseInterceptions") * 5
    + v("defenseFumbleForced") * 3 + v("defensePassDeflections") + v("defenseTouchdowns") * 6 + v("kickFieldGoalsMade") * 2;
}
function statLine(st) {
  const v = (k) => st[k] || 0, out = [];
  if (v("passAttempts")) out.push(`${v("passCompletion")}/${v("passAttempts")}, ${v("passYards")} yds, ${v("passTD")} TD${v("passINT") ? `, ${v("passINT")} INT` : ""}`);
  if (v("rushAttempts")) out.push(`${v("rushAttempts")} car, ${v("rushYards")} yds${v("rushTD") ? `, ${v("rushTD")} TD` : ""}`);
  if (v("receiveReceptions")) out.push(`${v("receiveReceptions")} rec, ${v("receivingYards")} yds${v("receiveTouchdowns") ? `, ${v("receiveTouchdowns")} TD` : ""}`);
  const def = [v("defenseTotalTackles") && `${v("defenseTotalTackles")} tkl`, v("defenseTacklesForLoss") && `${v("defenseTacklesForLoss")} TFL`, v("defenseSacks") && `${v("defenseSacks")} sck`, v("defenseInterceptions") && `${v("defenseInterceptions")} INT`, v("defenseFumbleForced") && `${v("defenseFumbleForced")} FF`].filter(Boolean);
  if (def.length) out.push(def.join(", "));
  if (v("kickFieldGoalAttempts")) out.push(`${v("kickFieldGoalsMade")}/${v("kickFieldGoalAttempts")} FG`);
  return out.join(" · ");
}

function boxHtml(g, b) {
  const A = g.away, H = g.home, BA = b.Away, BH = b.Home;
  const posName = (p) => (b.Positions || [])[p.Position] ?? "";
  const awayP = (b.Players || []).filter((p) => p.Team === A.team_key), homeP = (b.Players || []).filter((p) => p.Team === H.team_key);

  // linescore
  const qA = BA.Quarters || [], qH = BH.Quarters || [];
  const ot = (qA[4] || 0) + (qH[4] || 0) > 0;
  const qn = ot ? 5 : 4, qLbl = ["1", "2", "3", "4", "OT"];
  const lsRow = (s, q, score, bb) => `<tr><td><div class="team-cell">${badge(s.team)}<span class="nm">${rk(s.rank_at_game)}${tLink(s.team, s.team_key)}</span></div></td>${q.slice(0, qn).map((x) => `<td>${x ?? 0}</td>`).join("")}<td>${score}</td></tr>`;
  const linescore = `<section class="card"><h2 class="card-h">Scoring by quarter</h2><table class="tbl ls"><thead><tr><th></th>${qLbl.slice(0, qn).map((x) => `<th>${x}</th>`).join("")}<th>T</th></tr></thead>
    <tbody>${lsRow(A, qA, A.score)}${lsRow(H, qH, H.score)}</tbody></table></section>`;

  // players of the game
  const pog = (b.Players || []).map((p) => ({ p, sc: playerScore(p.Stats || {}) })).filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 5);
  const pogHtml = `<section class="card pog"><h2 class="card-h">Players of the game</h2>${pog.length ? `<ul class="lst">${pog.map(({ p }, i) => {
    const t = p.Team === A.team_key ? A : H;
    return `<li><span class="r">${i + 1}</span>${badge(t.team)}<div class="main"><div class="a">${plLink(p.Name, p.Key)} <span class="b">${esc(posName(p))} · ${esc(p.TeamAbbrev || t.team)}</span></div>
      <div class="line">${esc(statLine(p.Stats || {}))}</div></div></li>`; }).join("")}</ul>` : '<div class="empty">No player stats in this box score.</div>'}</section>`;

  // team stat comparison
  const sa = BA.Stats || {}, sh = BH.Stats || {};
  const ca = teamColor(A.team), ch = teamColor(H.team);
  const cmp = (label, va, vh, fmt = (x) => x ?? "—", na = va, nh = vh) => {
    const tot = (Number(na) || 0) + (Number(nh) || 0), wa = tot ? ((Number(na) || 0) / tot) * 100 : 50;
    return `<div class="cmp-row"><div class="cmp-top"><b>${fmt(va, sa)}</b><span>${label}</span><b>${fmt(vh, sh)}</b></div>
      <div class="cmp-bar"><i style="width:${wa}%;background:${ca}"></i><i style="width:${100 - wa}%;background:${ch}"></i></div></div>`;
  };
  const ratio = (m, a) => (s) => `${s[m] ?? 0}-${s[a] ?? 0}`;
  const teamStats = `<section class="card"><h2 class="card-h"><span style="display:flex;align-items:center;gap:8px">${badge(A.team)}${esc(BA.Abbrev || A.team)}</span>Team stats<span style="display:flex;align-items:center;gap:8px">${esc(BH.Abbrev || H.team)}${badge(H.team)}</span></h2><div class="cmp">
    ${cmp("Total yards", sa.offYardsGained, sh.offYardsGained)}
    ${cmp("Yards per play", sa.offYardsPerPlay, sh.offYardsPerPlay, f1)}
    ${cmp("First downs", sa.offFirstdown, sh.offFirstdown)}
    ${cmp("Passing yards", sa.offPassYards, sh.offPassYards)}
    ${cmp("Comp-att", 0, 0, (x, s) => ratio("completions", "passAttempts")(s), sa.completions, sh.completions)}
    ${cmp("Yards per pass", sa.yardsPerPass, sh.yardsPerPass, f1)}
    ${cmp("Rushing yards", sa.offRushYards, sh.offRushYards)}
    ${cmp("Rushing attempts", sa.rushes, sh.rushes)}
    ${cmp("Yards per rush", sa.yardsPerRush, sh.yardsPerRush, f1)}
    ${cmp("3rd down", 0, 0, (x, s) => `${ratio("thirdDownConversions", "thirdDowns")(s)} (${pct(s.thirdDownConversions, s.thirdDowns)}%)`, pct(sa.thirdDownConversions, sa.thirdDowns), pct(sh.thirdDownConversions, sh.thirdDowns))}
    ${cmp("4th down", 0, 0, (x, s) => ratio("fourthDownConversions", "fourthDowns")(s), pct(sa.fourthDownConversions, sa.fourthDowns), pct(sh.fourthDownConversions, sh.fourthDowns))}
    ${cmp("Red zone TD / FG", 0, 0, (x, s) => `${s.redZoneOffTD ?? 0} / ${s.redZoneOffFG ?? 0}`, sa.redZoneOffTD, sh.redZoneOffTD)}
    ${cmp("Turnovers", sa.turnovers, sh.turnovers)}
    ${cmp("Penalties-yards", 0, 0, (x, s) => ratio("penalties", "penaltyYards")(s), sa.penalties, sh.penalties)}
    ${cmp("Punts (avg)", 0, 0, (x, s) => `${s.teamPunts ?? 0} (${f1(s.puntAverage)})`, sa.teamPunts, sh.teamPunts)}
    ${cmp("Kick return yards", sa.kickReturnYards, sh.kickReturnYards)}
    ${cmp("Punt return yards", sa.puntReturnYards, sh.puntReturnYards)}
    ${cmp("Possession", sa.possessionSeconds, sh.possessionSeconds, mmss)}
  </div></section>`;

  // player box score by category
  const teamTable = (t, list, cat) => {
    const rows = list.filter((p) => cat.show(p.Stats || {})).sort((a, b) => (b.Stats[cat.sort] || 0) - (a.Stats[cat.sort] || 0));
    return `<div><div class="bx-team">${badge(t.team)}${esc(t.team)}</div>${rows.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Player</th>${cat.cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
      ${rows.map((p) => `<tr><td class="pl">${plLink(p.Name, p.Key)}<small>${esc(posName(p))}</small></td>${cat.cols.map((c) => `<td>${c[1](p.Stats) ?? 0}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
      : '<div class="empty">None</div>'}</div>`;
  };
  const playerBox = BOX_CATS.filter((c) => (b.Players || []).some((p) => c.show(p.Stats || {})))
    .map((c) => `<section class="card"><h2 class="card-h">${c.title}</h2><div class="bx2">${teamTable(A, awayP, c)}${teamTable(H, homeP, c)}</div></section>`).join("");

  return `${linescore}<div class="gm-grid"><div>${pogHtml}</div><div>${teamStats}</div></div>${playerBox}`;
}

  : p === "K" ? "K" : p === "P" ? "P" : "DEF";
const KEY_RATINGS = {

  DL: ["powerMoves", "finesseMoves", "blockShedding", "strength", "pursuit", "tackle", "playRecognition", "speed"],
  LB: ["tackle", "pursuit", "playRecognition", "hitPower", "blockShedding", "zoneCoverage", "manCoverage", "speed"],
  DB: ["speed", "manCoverage", "zoneCoverage", "press", "playRecognition", "acceleration", "catching", "tackle"],

const ratingSet = (pos) => KEY_RATINGS[pos] || KEY_RATINGS[["LT", "LG", "C", "RG", "RT"].includes(pos) ? "OL" : ["LEDG", "REDG", "DT"].includes(pos) ? "DL"

  P: { main: ["puntYards", "Punt yards"], tiles: [["punts", "Punts"], ["puntsAverage", "Average", 1], ["puntsDownIn20", "Inside 20"], ["puntsLong", "Long"]],

const skillsCache = {};

function renderPlayer(key) {
  $("#view").innerHTML = '<div class="card"><div class="empty">Loading player…</div></div>';
  loadRosters().then(async (roster) => {
    if (location.hash !== "#player/" + key) return;
    let p = roster.find((x) => x.player_key === key);
    if (!p) { const ap = (await loadAllPlayers()).find((x) => x.player_key === key); if (ap) p = (await api(`/rosters?team=${ap.team_key}`).then((r) => r.data || []).catch(() => [])).find((x) => x.player_key === key) || ap; if (location.hash !== "#player/" + key) return; }
    if (!p) { $("#view").innerHTML = '<div class="card"><div class="empty">Player cards are available for players on teams with a league coach. This player isn’t on a synced roster.</div></div>'; return; }
    const team = teamByKey(p.team_key) || { name: games().map((g) => [g.home, g.away]).flat().find((s) => s.team_key === p.team_key)?.team || "", team_key: p.team_key };
    const tc = teamColor(team.name), grp = POS_GROUP(p.position), G = PGROUP[grp];
    const season = (await teamPlayers(p.team_key)).find((x) => x.player_key === key)?.stats || {};
    const ratings = p.ratings || {};
    const keys = ratingSet(p.position).filter((k) => ratings[k] != null);
    const allSorted = Object.entries(ratings).sort((a, b) => b[1] - a[1]);
    const rtRow = ([k, v]) => `<div class="rt"><span>${esc(words(k))}</span><span class="bar"><i style="width:${v}%;background:${ratingColor(v)}"></i></span><b>${v}</b></div>`;
    const cls = `${p.class_year || ""}${p.redshirted ? " (RS)" : ""}`;
    const tileVal = (k, dec) => (season[k] == null ? "—" : dec ? f1(season[k]) : Number(season[k]).toLocaleString());

    $("#view").innerHTML = `
      <section class="card pc-head" style="background:linear-gradient(110deg, ${tc}, color-mix(in srgb, ${tc} 55%, #000));color:${teamInk(team.name)};border-bottom:4px solid ${teamAccent(team.name)}">
        <div class="pc-top"><span class="pc-num">${p.jersey ?? ""}</span>
          <div><div class="pc-first">${esc(p.first_name || "")}</div>
            <h1 class="pc-last">${esc(p.last_name || p.name)}<small>#${p.jersey ?? ""}</small>${p.dev_trait && p.dev_trait !== "Normal" ? `<span class="chip ${esc(p.dev_trait)}">${esc(p.dev_trait)}</span>` : ""}</h1>
            <div class="pc-sub">${esc(p.position)} · ${tLink(team.name, team.team_key)} · ${esc(p.archetype || "")}</div>
            <div class="pc-meta"><span>${esc(cls)}</span><span>${htFmt(p.height)}</span><span>${p.weight || "—"} lbs</span>${p.hometown ? `<span>${esc(p.hometown)}</span>` : ""}${p.nil_compensation != null ? `<span>NIL $${money(p.nil_compensation)}</span>` : ""}</div></div>
          ${logoUrl(team.name) ? `<img src="${esc(logoUrl(team.name))}" alt="${esc(team.name)}" style="width:96px;height:96px;object-fit:contain;margin-left:auto">` : ""}
          <div class="pc-ovr" ${logoUrl(team.name) ? 'style="margin-left:0"' : ""}><span>OVERALL</span><b>${p.overall ?? "—"}</b></div></div>
      </section>
      <div class="tp-grid"><div>
        <section class="card"><h2 class="card-h">Season snapshot <small>${esc(D.schedule?.season || "")}${season.gamesPlayed != null ? " · " + season.gamesPlayed + " games" : ""}</small></h2>
          <div class="tiles" style="--tc:${tc}">${G.tiles.map(([k, l, dec]) => `<div class="tile"><b>${tileVal(k, dec)}</b><span>${l}</span></div>`).join("")}</div></section>
        <section class="card"><h2 class="card-h">Game by game <small>${G.main[1]}</small></h2><div id="pc-arc"><div class="empty">Loading games…</div></div></section>
        <section class="card"><h2 class="card-h">Game log</h2><div id="pc-log"><div class="empty">Loading games…</div></div></section>
        <section class="card" id="pc-career" hidden><h2 class="card-h">Dynasty career</h2><div class="in"></div></section>
      </div><div>
        <section class="card" id="pc-awards" hidden><h2 class="card-h">Awards <small></small></h2><div class="in"></div></section>
        <section class="card"><h2 class="card-h">Ratings</h2>
          <div class="rt-head"><span class="ring" style="--p:${p.overall || 0};--rc:${ratingColor(p.overall || 0)}"><b>${p.overall ?? "—"}</b></span><div>${esc(p.position)} · ${esc(cls)}<small>${esc(p.archetype || "")}${p.dev_trait ? " · " + esc(p.dev_trait) + " dev" : ""}</small></div></div>
          <div id="pc-rt">${keys.map((k) => rtRow([k, ratings[k]])).join("")}</div>

        ${(p.abilities || []).length ? `<section class="card"><h2 class="card-h">Abilities</h2><div class="abil">${p.abilities.map((a) => `<span>${esc(a.name)}<small>tier ${a.tier}</small></span>`).join("")}</div></section>` : ""}
        ${(p.skill_groups || []).length ? `<section class="card"><h2 class="card-h">Skill groups <small>${p.skill_points ?? 0} unspent points</small></h2>
          ${p.skill_groups.map((g) => `<div class="sg"><div class="sg-top"><span>${esc(g.name)}</span><b>${g.overall ?? ""}</b></div>

          <div class="b" style="padding:4px 14px 12px;font-size:11px;color:var(--dim)">Solid = filled tiers · light = buyable up to potential · striped = locked</div></section>` : ""}

    document.title = `${p.name} · ${CONFIG.SITE_NAME}`;
    playerHistory(key);
    const more = $("#pc-more");
    if (more) more.onclick = () => { const open = more.dataset.open === "1"; $("#pc-rt").innerHTML = (open ? keys.map((k) => [k, ratings[k]]) : allSorted).map(rtRow).join(""); more.dataset.open = open ? "0" : "1"; more.textContent = open ? "All ratings" : "Key ratings only"; };

    // game log from box scores of this team's games
    const tg = games().filter((g) => g.played && g.has_box_score && (g.home.team_key === p.team_key || g.away.team_key === p.team_key)).sort((a, b) => a.week - b.week);
    const full = await Promise.all(tg.map(loadGame));

    if (!log.length) { $("#pc-arc").innerHTML = $("#pc-log").innerHTML = '<div class="empty">No box-score games for this player yet.</div>'; }
    else {
      const mk = G.main[0], max = Math.max(1, ...log.map((x) => x.st[mk] || 0));
      $("#pc-arc").innerHTML = `<div class="arc">${log.map(({ g, st }) => { const v = st[mk] || 0, [at, o] = opp(g);
        return `<div title="${esc(at + " " + o.team)}"><b>${v}</b><i style="height:${(v / max) * 110}px;background:${res(g)[0] === "W" ? tc : "color-mix(in srgb," + tc + " 45%, var(--line))"}"></i><small>${esc(weekLabel(g.week).replace("Week ", "Wk "))}</small><small>${at} ${esc(initials(o.team))}</small></div>`; }).join("")}</div>`;
      $("#pc-log").innerHTML = `<div class="scroll"><table class="tbl"><thead><tr><th>Game</th><th>Result</th>${G.cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
        ${[...log].reverse().map(({ g, st }) => { const [at, o] = opp(g), [w, sc] = res(g);
          return `<tr><td><div class="team-cell"><span class="b" style="color:var(--dim);min-width:38px">${esc(weekLabel(g.week).replace("Week ", "Wk "))}</span>${at} ${badge(o.team)}${tLink(o.team, o.team_key)}</div></td>
            <td><a class="tl" href="#game/${g.key}"><span class="res ${w}">${w}</span> ${sc}</a></td>${G.cols.map((c) => `<td>${c[1](st) ?? 0}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`;
    }
    // development history (overall by week) once there are 2+ snapshots
    const sk = await loadSkills(key);
    const hist = sk?.history || [];
    if (hist.length > 1 && location.hash === "#player/" + key) {
      $("#pc-dev").hidden = false;
      $("#pc-dev-in").innerHTML = `<table class="tbl"><thead><tr><th>Week</th><th>OVR</th><th>Skill points</th><th>Upgrades</th></tr></thead><tbody>${[...hist].reverse().map((h) =>
        `<tr><td>${esc(h.season_text)}</td><td><b>${h.overall}</b></td><td>${h.skill_points ?? ""}${h.points_change ? ` <small>(${h.points_change > 0 ? "+" : ""}${h.points_change})</small>` : ""}</td><td>${esc(Object.entries(h.levels_gained || {}).map(([k, v]) => `${k} +${v}`).join(", ") || "—")}</td></tr>`).join("")}</tbody></table>`;
    }
  });
}

// shrink big images to 256px (keeps transparency) so pages stay fast
function prepLogo(file) {
  if (file.type === "image/svg+xml" || file.type === "image/gif") return Promise.resolve({ blob: file, type: file.type });
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob((b) => (b ? res({ blob: b, type: "image/png" }) : rej(new Error("Couldn't read that image"))), "image/png"); };
    img.onerror = () => rej(new Error("Couldn't read that image")); img.src = url;
  });
}

/* =========================================================

   Data is archived by the GitHub Action into data/history/<league_id>/
   ========================================================= */
const HISTORY_BASE = "https://pirateflag23.github.io/dynasty-site/data/history";

const H = { cache: {} };
const hLeague = () => D.league?.league_id ?? D.league?.data?.league_id;
const hGet = (path) => (H.cache[path] ??= fetch(`${HISTORY_BASE}/${hLeague()}/${path}`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null));
const coachLabel = (c, link = true) => {
  const txt = c.name ? `${esc(c.name)} <span class="h-gt">(${esc(c.gamertag)})</span>` : esc(c.gamertag);
  return link ? `<a class="tl" href="#coach/${encodeURIComponent(c.gamertag)}">${txt}</a>` : txt;
};
const hWl = (w, l, t) => `${w}-${l}${t ? "-" + t : ""}`;
const hPct = (v) => (v == null ? "—" : v.toFixed(3).replace(/^0/, ""));
const hNum = (v) => (v == null ? "—" : Number(v).toLocaleString("en-US"));
const DATA_BASE = HISTORY_BASE.replace(/\/history$/, "");
let ncaaP = null, hofP = null;
const ncaaRecords = () => (ncaaP ??= fetch(`${DATA_BASE}/ncaa-records.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null));
const hallOfFame = () => (hofP ??= fetch(`${DATA_BASE}/hall-of-fame.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null));
const REC_NOUN = { passYards: "yards", passTD: "TD passes", rushYards: "yards", rushTD: "rushing TD", receivingYards: "yards", receiveReceptions: "catches",
  receiveTouchdowns: "TD catches", defenseTotalTackles: "tackles", defenseSacks: "sacks", defenseInterceptions: "INTs", kickFieldGoalsMade: "field goals" };
const SEASON_GAMES = 13; // pace basis: 12 regular season + a postseason game
/* gold "NCAA record" row + the closest active chaser, for one leaders table */
function recordBits(d, sub, cat, rec, idx) {
  const R = rec?.[sub === "careers" ? "career" : "season"]?.[cat];
  if (!R) return { row: "", chase: "", beat: () => false };
  const cur = Math.max(...d.seasons.map(Number));
  const row = `<tr class="ncaa-rec"><td>🏛</td><td class="pl"><span class="rec-tag">NCAA record</span><b>${esc(R.holder)}</b>${R.note ? ` <small>${esc(R.note)}</small>` : ""}</td><td>${esc(R.years)}</td><td>${esc(R.school)}</td><td></td><td><b>${hNum(R.value)}</b></td></tr>`;
  const all = (sub === "careers" ? d.career : d.season)[cat] || [];
  const live = sub === "careers" ? all.find((r) => String(r.span).endsWith(String(cur))) : all.find((r) => Number(r.y) === cur);
  let chase = "";
  if (live) {
    const who = `<a class="pl-link" href="#player/${live.k}"><b>${esc(live.n)}</b></a> <small>${esc(live.p || "")} · ${esc(live.tn)}</small>`;
    if (live.v > R.value) chase = `<div class="chase"><span class="kick">👑 Record broken</span>${who} owns the NCAA ${sub === "careers" ? "career" : "single-season"} mark with <b>${hNum(live.v)}</b>, passing ${esc(R.holder)}'s ${hNum(R.value)}.</div>`;
    else {
      const pct = Math.min(100, Math.round((live.v / R.value) * 100)), left = R.value - live.v;
      const pace = sub === "seasons" && live.g && live.g < SEASON_GAMES ? Math.round((live.v / live.g) * SEASON_GAMES) : null;
      const paceTxt = pace ? ` · on pace for <b>${hNum(pace)}</b>${pace > R.value ? " 🔥" : ""}` : "";
      const gl = sub === "seasons" && live.g < SEASON_GAMES ? ` with ~${SEASON_GAMES - live.g} games left` : "";
      chase = `<div class="chase"><span class="kick">${sub === "careers" ? "Active career leader" : `${cur} leader`} · chasing ${esc(R.holder)}</span>${who} is <b>${hNum(left)}</b> ${REC_NOUN[cat] || ""} off the record${gl} (${pct}% of the way)${paceTxt}
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }
  }
  return { row, chase, beat: (r) => r.v > R.value };
}
