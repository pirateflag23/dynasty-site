      if (sub === "seasons" && hYear !== "all") rows = rows.filter((r) => String(r.y) === String(hYear));
      $("#h-in").innerHTML = `<div class="ctrl">${Object.entries(d.cats).map(([k, l]) => `<button class="pill" data-cat="${k}" aria-pressed="${k === hCat}">${esc(l)}</button>`).join("")}</div>
        ${sub === "seasons" ? `<div class="ctrl"><button class="pill" data-yr="all" aria-pressed="${hYear === "all"}">All seasons</button>${d.seasons.map((y) => `<button class="pill" data-yr="${y}" aria-pressed="${String(y) === String(hYear)}">${y}</button>`).join("")}</div>` : ""}
        ${rb.chase}
        <div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th>${sub === "careers" ? "Seasons" : "Season"}</th><th>Team</th><th>G</th><th>${esc(d.cats[hCat])}</th></tr></thead><tbody>
        ${rb.row}
        ${rows.slice(0, 25).map((r, i) => `<tr${rb.beat(r) ? ' class="beat"' : ""}><td>${i + 1}</td><td class="pl"><a class="pl-link" href="#player/${r.k}">${esc(r.n)}</a> <small>${esc(r.p || "")}</small>${rb.beat(r) ? '<span class="rec-crown">👑 NCAA record</span>' : ""}</td><td>${sub === "careers" ? esc(r.span) : r.y}</td><td>${esc(r.tn)}</td><td>${r.g}</td><td><b>${hNum(r.v)}</b></td></tr>`).join("") || '<tr><td colspan="6">No data</td></tr>'}</tbody></table></div>
        <div class="h-note">${sub === "careers" ? "Totals across every season of this dynasty, all teams combined." : "Best single seasons in dynasty history. Pick a season to compare years."}${rec ? ` Gold row: the official real-life NCAA FBS record (through ${rec.through}). Dynasty careers only count seasons played in this league.` : ""}</div>`;
      document.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { hCat = b.dataset.cat; draw(); });
      document.querySelectorAll("[data-yr]").forEach((b) => b.onclick = () => { hYear = b.dataset.yr; draw(); });
    };
    draw();
  } else if (sub === "champions") {
    await renderChampions();
  } else if (sub === "trophies") {
    await renderTrophies();
  } else if (sub === "hof") {
    await renderHof();
  }
}

/* ---------- shared: archived seasons + coach lookup ---------- */
async function hSeasons() {
  const idx = await hGet("index.json");
  const years = [...(idx?.seasons || [])].sort((a, b) => b - a);
  const list = (await Promise.all(years.map((y) => hGet(`seasons/${y}.json`)))).filter(Boolean);
  const coaches = (await hGet("coaches.json"))?.coaches || [];
  const byTag = new Map(coaches.map((c) => [c.gamertag, c]));
  return { list, byTag };
}
const hSide = (g, won) => { const aw = g.a.s > g.h.s; return won === aw ? g.a : g.h; };
const hTeam = (x) => `${x.r ? `<span class="rk">${x.r}</span>` : ""}${tLink(x.t, x.k)}`;
const hCoachOf = (x, byTag) => (x.u ? (byTag.get(x.u) ? coachLabel(byTag.get(x.u)) : esc(x.u)) : "");
function hResult(g, byTag, opts = {}) {
  const W = hSide(g, true), L = hSide(g, false);
  const wc = hCoachOf(W, byTag), lc = hCoachOf(L, byTag);
  return `<div class="h-res${opts.big ? " big" : ""}">${badge(W.t)}<div class="h-res-m"><div><b>${hTeam(W)}</b> <span class="sc">${W.s}</span><span class="vs">def.</span>${hTeam(L)} <span class="sc l">${L.s}</span></div>
    ${wc || lc ? `<small>${wc ? `🎮 ${wc}` : ""}${wc && lc ? " · " : ""}${lc ? `vs 🎮 ${lc}` : ""}</small>` : ""}</div><a class="bx-link" href="#game/${g.key}">Box</a></div>`;
}

// Award titles grouped so the season page reads like a trophy case, not a list.
const AWARD_GROUPS = [
  ["Player of the year", /heisman|maxwell|walter camp|player of the year|archie griffin/i],
  ["Offense", /o'?brien|unitas|manning|doak walker|biletnikoff|mackey|hornung|offensive/i],
  ["Line", /outland|rimington|lombardi|joe moore|lineman/i],
  ["Defense", /bednarik|nagurski|butkus|thorpe|lott|hendricks|defensive|edge rusher/i],
  ["Special teams", /groza|ray guy|returner|special|jet award/i],
  ["Freshman", /freshman|shaun alexander/i],
];
const awardGroup = (title) => (AWARD_GROUPS.find(([, re]) => re.test(title)) || ["Other"])[0];

let hChampYear = null;
async function renderChampions() {
  const { list, byTag } = await hSeasons();
  if (!list.length) { $("#h-in").innerHTML = '<div class="empty">No seasons archived yet.</div>'; return; }
  if (!list.some((s) => s.season === hChampYear)) hChampYear = (list.find((s) => s.final) || list[0]).season;
  const s = list.find((x) => x.season === hChampYear);
  const played = s.games.filter((g) => g.played);
  const natty = played.find((g) => g.type === "natty");
  // CFP rounds: First Round games, then the New Year's Six bowls (earlier week = quarterfinals, later = semifinals)
  const cfp = played.filter((g) => g.type === "cfp");
  const first = cfp.filter((g) => /First Round/i.test(g.label));
  const ny6 = cfp.filter((g) => !/First Round/i.test(g.label));
  const wks = [...new Set(ny6.map((g) => g.w))].sort((a, b) => a - b);
  const qf = wks.length > 1 ? ny6.filter((g) => g.w === wks[0]) : ny6.slice(0, 4);
  const sf = wks.length > 1 ? ny6.filter((g) => g.w !== wks[0]) : ny6.slice(4);
  const round = (title, games) => (games.length ? `<div class="h-round"><h4>${title}</h4>${games.map((g) => `<div class="h-bowl"><span class="bn">${esc(/First Round/i.test(g.label) ? "" : g.label)}</span>${hResult(g, byTag)}</div>`).join("")}</div>` : "");
  const confG = played.filter((g) => g.type === "confchamp").sort((a, b) => a.label.localeCompare(b.label));
  const awards = s.annual_awards.filter((a) => !/HC|OC|DC/.test(a.position || ""));
  const coachAw = s.annual_awards.filter((a) => /HC|OC|DC/.test(a.position || ""));
  const groups = {}; for (const a of awards) (groups[awardGroup(a.title)] ??= []).push(a);
  const order = [...AWARD_GROUPS.map(([g]) => g), "Other"];
  const awardCard = (a) => `<div class="h-award"><small>${esc(a.title)}</small><b>${esc(a.name)}</b><span>${esc(a.position || "")} · ${esc(a.team?.name || "")}</span></div>`;
  const aa = s.all_americans.filter((t) => t.conf === "National" && !/preseason/i.test(t.team));

  $("#h-in").innerHTML = `
    <div class="ctrl">${list.map((x) => `<button class="pill" data-cy="${x.season}" aria-pressed="${x.season === hChampYear}">${x.season}${x.final ? "" : " •"}</button>`).join("")}</div>
    ${natty ? `<div class="h-natty"><div class="lbl">🏆 ${s.season} National Champion</div>${hResult(natty, byTag, { big: true })}</div>` : `<div class="h-note">${s.season} is still in progress. The national champion appears here after the title game.</div>`}
    ${cfp.length || natty ? `<h3 class="h-sec">College Football Playoff</h3><div class="h-bracket">${round("First round", first)}${round("Quarterfinals", qf)}${round("Semifinals", sf)}${natty ? round("National Championship", [natty]) : ""}</div>` : ""}
    ${confG.length ? `<h3 class="h-sec">Conference champions</h3><div class="h-confs">${confG.map((g) => `<div class="h-bowl"><span class="bn">${esc(g.label.replace(/ Championship$/, ""))}</span>${hResult(g, byTag)}</div>`).join("")}</div>` : ""}
    ${awards.length ? `<h3 class="h-sec">Player awards</h3>${order.filter((g) => groups[g]).map((g) => `<div class="h-agrp"><h4>${g}</h4><div class="h-awards">${groups[g].map(awardCard).join("")}</div></div>`).join("")}` : ""}
    ${coachAw.length ? `<h3 class="h-sec">Coaching awards</h3><div class="h-awards">${coachAw.map(awardCard).join("")}</div>` : ""}
    ${aa.length ? `<h3 class="h-sec">All-Americans</h3>${aa.map((t) => `<div class="h-agrp"><h4>${esc(t.team)}</h4><div class="h-aa">${t.players.map((p) => `<span><b>${esc(p.p)}</b> <a class="pl-link" href="#player/${p.k}">${esc(p.n)}</a> <small>${esc(p.tn)}</small></span>`).join("")}</div></div>`).join("")}` : ""}`;
  document.querySelectorAll("[data-cy]").forEach((b) => b.onclick = () => { hChampYear = +b.dataset.cy; renderChampions(); });
}

/* ---------- trophy room: every title, bowl and rivalry trophy, with its history ---------- */
let hTrophyFilter = "all";
async function renderTrophies() {
  const [{ list, byTag }, rv, recs] = await Promise.all([hSeasons(), fetch(`${HISTORY_BASE.replace(/\/data\/history$/, "")}/rivalries.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : { rivalries: [] })).catch(() => ({ rivalries: [] })), hGet("records.json")]);
  const nm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const rivalOf = new Map(); for (const [a, b, n] of rv.rivalries || []) { rivalOf.set(nm(a) + "|" + nm(b), n); rivalOf.set(nm(b) + "|" + nm(a), n); }
  const T = new Map();
  const add = (name, kind, rank, season, g) => { const t = T.get(name) || { name, kind, rank, games: [] }; t.games.push({ season, g }); T.set(name, t); };
  for (const s of list) for (const g of s.games.filter((x) => x.played)) {
    if (g.type === "natty") add("National Championship", "cfp", 0, s.season, g);
    else if (g.type === "cfp") add(/First Round/i.test(g.label) ? "CFP First Round" : g.label, "cfp", /First Round/i.test(g.label) ? 2 : 1, s.season, g);
    else if (g.type === "confchamp") add(g.label, "conf", 3, s.season, g);
    else if (g.type === "bowl") add(g.label, "bowl", 4, s.season, g);
    else { const r = rivalOf.get(nm(g.a.t) + "|" + nm(g.h.t)); if (r) add(r, "rivalry", 5, s.season, g); }
  }
  const kinds = [["all", "All"], ["cfp", "Playoff"], ["conf", "Conference titles"], ["bowl", "Bowls"], ["rivalry", "Rivalry trophies"]];
  let rows = [...T.values()].filter((t) => hTrophyFilter === "all" || t.kind === hTrophyFilter).sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name));
  const icon = { cfp: "🏆", conf: "🥇", bowl: "🏈", rivalry: "⚔️" };
  $("#h-in").innerHTML = `${recordShelf(recs)}<div class="ctrl">${kinds.map(([k, l]) => `<button class="pill" data-tf="${k}" aria-pressed="${k === hTrophyFilter}">${l}</button>`).join("")}</div>
    <div class="h-trophies">${rows.map((t) => `<div class="h-tcard ${t.kind}"><h4>${icon[t.kind]} ${esc(t.name)}${t.kind === "rivalry" ? ` <small>${esc(t.games[0].g.a.t)} vs ${esc(t.games[0].g.h.t)}</small>` : ""}</h4>
      ${t.games.sort((a, b) => b.season - a.season || b.g.w - a.g.w).map(({ season, g }) => `<div class="h-trow"><span class="yr">${season}</span>${hResult(g, byTag)}</div>`).join("")}</div>`).join("") || '<div class="empty">No trophies in this category yet.</div>'}</div>
    <div class="h-note">Every championship, playoff game, bowl and rivalry trophy in this dynasty. 🎮 marks a league coach.</div>`;
  document.querySelectorAll("[data-tf]").forEach((b) => b.onclick = () => { hTrophyFilter = b.dataset.tf; renderTrophies(); });
}

function recordShelf(recs) {
  const b = recs?.broken || [];
  return `<div class="shelf"><h3>👑 Records broken in The Dynasty<small>Real-life NCAA FBS records that a player in this league has passed.</small></h3>
    ${b.length ? b.map((r) => `<div class="shelf-row"><div class="big">${hNum(r.v)}</div><div class="who"><a class="pl-link" href="#player/${r.k}"><b>${esc(r.n)}</b></a> ${esc(r.p || "")} · ${esc(r.tn)}
      <small>${r.scope === "season" ? `${r.y} single-season` : "Career"} ${esc(r.label)}. Passed ${esc(r.old.holder)} (${esc(r.old.school)}, ${esc(r.old.years)}): ${hNum(r.old.value)}</small></div></div>`).join("")
    : `<div class="hof-empty"><span class="pl">🏛</span>No NCAA records have fallen yet. Check <a href="#history/seasons">Season leaders</a> to see who's chasing one.</div>`}</div>`;
}

/* =========================================================
   TD WIRE: storylines written by the GitHub Action (build-stories.mjs)
   data/stories/<league_id>/latest.json → Around the League + recruiting news
   ========================================================= */
const WIRE_BASE = "https://pirateflag23.github.io/dynasty-site/data/stories";
let WIRE = null, wireP = null;
const wireLoad = () => (wireP ??= (() => { const lid = D.league?.league_id ?? D.league?.data?.league_id; return lid ? fetch(`${WIRE_BASE}/${lid}/latest.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).then((w) => (WIRE = w)).catch(() => null) : Promise.resolve(null); })());
// Turns [[t:key|Name]] style tokens into site links; everything else is escaped.
function wireHtml(s) {
  if (!s) return "";
  const href = { t: (k) => `#team/${k}`, r: (k) => `#recruit/${k}`, p: (k) => `#player/${k}`, c: (k) => `#coach/${encodeURIComponent(k)}`, g: (k) => `#game/${k}` };
  let out = "", last = 0;
  for (const m of s.matchAll(/\[\[(\w):([^|\]]*)\|([^\]]*)\]\]/g)) {
    out += esc(s.slice(last, m.index));
    out += href[m[1]] ? `<a class="tl" href="${href[m[1]](m[2])}">${esc(m[3])}</a>` : esc(m[3]);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
const wireQuote = (q) => (q?.text ? `<blockquote class="wire-q">“${esc(q.text)}”<cite>${esc(q.by || "")}</cite></blockquote>` : "");
// byline + "Rumor mill" tag on stories written by the TD Wire AI desk
const wireBy = (st) => (st?.by ? `<div class="wire-by">By ${esc(st.by)}${st.rumor ? ' <span class="rumor">Rumor mill</span>' : ""}</div>` : "");

const SIDE = {};
const sideData = (name) => (SIDE[name] ??= fetch(`${DATA_BASE}/${name}`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null));
let scnPick = "";
function scnBlock(k, x) {
  const pc = (v) => (v == null ? "–" : `${v}%`);
  const grid = [...(x.by_losses || []).filter((r) => r.make != null).map((r) => `<div><b>${pc(r.make)}</b>${esc(r.label)} <small>(${r.chance}% likely)</small></div>`),
    x.conf_title != null && !/independent/i.test(x.conf || "") ? `<div><b>${pc(x.conf_title)}</b>Win the ${esc(x.conf)}</div>` : ""].join("");
  const nx = x.next ? `<p><span class="k">Next</span>${x.next.home ? "vs" : "at"} ${tLink(x.next.opp_name, x.next.opp)}: win and it's <span class="up">${pc(x.next.win)}</span>, lose and it's <span class="dn">${pc(x.next.loss)}</span>.</p>` : "";
  const rt = (x.root || []).length ? `<p><span class="k">Root for</span>${x.root.map((r) => `${tLink(r.want_name, r.want)} over ${esc(r.over_name)} <span class="up">+${r.gain}</span>`).join(" · ")}</p>` : "";
  const lock = x.make >= 99 ? "<p>All but locked in.</p>" : x.make <= 0.5 && !(x.by_losses || []).some((r) => r.make > 1) ? "<p>Needs a miracle. No path shows up in the simulations.</p>" : "";
  return `<div class="scn"><div class="scn-h">${badge(x.name)}${tLink(x.name, k)}<span class="pc">${pc(x.make)}</span></div><div class="scn-g">${grid}</div>${nx}${rt}${lock}</div>`;
}
function scenariosCard(c) {
  const S = c?.scenarios; if (!S || !Object.keys(S).length) return "";
  const users = Object.entries(S).filter(([, x]) => x.user).sort((a, b) => b[1].make - a[1].make);
  const others = Object.entries(S).filter(([, x]) => !x.user).sort((a, b) => a[1].name.localeCompare(b[1].name));
  const picked = scnPick && S[scnPick] && !S[scnPick].user ? [[scnPick, S[scnPick]]] : [];
  return `<section class="card" id="scn-card"><h2 class="card-h">Playoff scenarios <small>${c.sims?.toLocaleString?.() || ""} simulations</small></h2>
    <div class="scn-pick"><select id="scn-sel"><option value="">League coaches</option>${others.map(([k, x]) => `<option value="${k}" ${String(k) === String(scnPick) ? "selected" : ""}>${esc(x.name)} (${x.make}%)</option>`).join("")}</select></div>
    ${[...picked, ...(picked.length ? [] : users)].map(([k, x]) => scnBlock(k, x)).join("") || '<div class="empty">No league coaches in the race yet.</div>'}
    <div class="cfp-legend">Odds by how many more games a team loses, plus the other results that help them most. "+6" means that result adds about 6 points to their playoff odds.</div></section>`;
}

      <details class="cfp-legend"><summary>What drives these numbers</summary><p>${esc(c.method)}</p><p><b>Make CFP</b> chance to reach the 12-team field. <b>Δ</b> change since last advance. <b>Bye</b> top-four seed. <b>Conf</b> conference title. <b>Title</b> national championship. <b>Proj</b> average final record. <b>Power</b> rank from team ratings and scoring margin. <b>SOS</b> full-schedule strength rank (1 = hardest). <b>Rem SOS</b> remaining schedule rank (1 = hardest). <b>Pt diff</b> average scoring margin. The dashed line marks the 12-team cut.</p></details></section>

/* ---------- Rules (text lives in site/public/rules.md — edit that file) ---------- */
function mdLite(src) {
  const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+|#[^)\s]*)\)/g, '<a href="$2">$1</a>');
  let out = "", list = null, para = [];
  const flush = () => { if (para.length) { out += `<p>${para.map(inl).join("<br>")}</p>`; para = []; } };
  const close = () => { flush(); if (list) { out += `</${list}>`; list = null; } };
  for (const line of src.replace(/\r/g, "").split("\n")) {
    const t = line.trim(); let m;
    if (!t) { close(); continue; }
    if (list && /^\s/.test(line) && out.endsWith("</li>")) { out = out.slice(0, -5) + `<br>${inl(t.replace(/^[-*]\s+/, "– "))}</li>`; continue; }
    if ((m = t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/))) { close(); out += `<img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">`; }
    else if ((m = t.match(/^(#{1,3})\s+(.*)$/))) { close(); const h = m[1].length + 1; out += `<h${h}>${inl(m[2])}</h${h}>`; }
    else if ((m = t.match(/^(?:([-*])|\d+\.)\s+(.*)$/))) { flush(); const k = m[1] ? "ul" : "ol"; if (list !== k) { close(); out += `<${k}>`; list = k; } out += `<li>${inl(m[2])}</li>`; }
    else { if (list) close(); para.push(t); }
  }
  close(); return out;
}
function renderRules() {
  document.title = `Rules · ${CONFIG.SITE_NAME}`;
  $("#view").innerHTML = `<div class="rules"><section class="card"><h2 class="card-h">League Rules</h2><div class="body" id="rules-body"><div class="empty">Loading…</div></div></section></div>`;
  fetch("rules.md", { cache: "no-store" }).then((r) => r.ok ? r.text() : "").then((t) => {
    const el = $("#rules-body"); if (!el) return;
    el.innerHTML = t.trim() ? mdLite(t) : '<div class="empty">Rules coming soon.</div>';
  }).catch(() => { const el = $("#rules-body"); if (el) el.innerHTML = '<div class="empty">Couldn’t load the rules. Try refreshing.</div>'; });
}

// a believable fake box score for the sample games
function sampleBox(g) {
  const r = (n) => (hue(g.key + "x" + n) % 100) / 100, ri = (n, a, b) => Math.round(a + (b - a) * r(n));
  const quarters = (pts, n) => { const q = [0, 0, 0, 0, 0]; let left = pts; const parts = [7, 3, 7, 3, 7, 7, 3, 7, 6, 7]; let i = 0;
    while (left > 0) { const v = Math.min(left, parts[(i + n) % parts.length]); q[(i * 3 + n) % 4] += v; left -= v; i++; } return q; };
  const teamStats = (s, n) => { const pass = ri(n + 1, 150, 330), rush = ri(n + 2, 70, 230), plays = ri(n + 3, 55, 75), td = ri(n + 4, 12, 26), tdc = ri(n + 5, 3, 9);
    return { completions: ri(n + 6, 12, 26), passAttempts: ri(n + 7, 26, 38), offPassYards: pass, offRushYards: rush, offYardsGained: pass + rush, offYardsPerPlay: (pass + rush) / plays,
      offFirstdown: ri(n + 8, 12, 26), rushes: ri(n + 9, 22, 40), yardsPerPass: pass / 30, yardsPerRush: rush / 30, thirdDownConversions: tdc, thirdDowns: tdc + ri(n + 10, 3, 9),
      fourthDownConversions: ri(n + 11, 0, 2), fourthDowns: 2, redZoneOffTD: ri(n + 12, 1, 4), redZoneOffFG: ri(n + 13, 0, 2), turnovers: ri(n + 14, 0, 3),
      penalties: ri(n + 15, 2, 9), penaltyYards: ri(n + 16, 15, 70), teamPunts: ri(n + 17, 2, 6), puntAverage: 38 + 10 * r(n + 18), kickReturnYards: ri(n + 19, 20, 110),
      puntReturnYards: ri(n + 20, 0, 40), possessionSeconds: 1500 + ri(n + 21, 0, 600) }; };
  const players = (t, n) => {
    const P = (i, pos, stats) => ({ Key: t.team_key * 100 + i, Name: SN[(i + n) % SN.length].replace(/^(\w)\w+ /, "$1."), Team: t.team_key, TeamAbbrev: initials(t.team), Position: pos, Stats: stats });
    return [P(1, 0, { passCompletion: ri(n + 30, 14, 25), passAttempts: ri(n + 31, 26, 36), passYards: ri(n + 32, 160, 340), passTD: ri(n + 33, 1, 4), passINT: ri(n + 34, 0, 2), passSacks: ri(n + 35, 0, 3), passerRating: 110 + 50 * r(n + 36), rushAttempts: 4, rushYards: ri(n + 37, -5, 40) }),
      P(2, 1, { rushAttempts: ri(n + 40, 14, 26), rushYards: ri(n + 41, 50, 160), rushTD: ri(n + 42, 0, 2), rushLong: ri(n + 43, 12, 45), rushBrokenTackles: ri(n + 44, 1, 7), receiveReceptions: 2, receivingYards: 14 }),
      P(3, 3, { receiveReceptions: ri(n + 50, 4, 9), receivingYards: ri(n + 51, 50, 150), receiveTouchdowns: ri(n + 52, 0, 2), receiveLongReception: ri(n + 53, 15, 55), receiveYardsAfterCatch: ri(n + 54, 10, 60) }),
      P(4, 4, { receiveReceptions: ri(n + 60, 2, 6), receivingYards: ri(n + 61, 20, 80), receiveTouchdowns: ri(n + 62, 0, 1), receiveLongReception: ri(n + 63, 8, 30) }),
      P(5, 14, { defenseTotalTackles: ri(n + 70, 6, 13), defenseTacklesSolo: ri(n + 71, 3, 7), defenseTacklesForLoss: ri(n + 72, 0, 2), defenseSacks: ri(n + 73, 0, 1) }),
      P(6, 10, { defenseTotalTackles: ri(n + 80, 2, 6), defenseTacklesSolo: 2, defenseTacklesForLoss: ri(n + 81, 1, 3), defenseSacks: ri(n + 82, 1, 3), defenseFumbleForced: ri(n + 83, 0, 1) }),
      P(7, 16, { defenseTotalTackles: ri(n + 90, 2, 6), defenseTacklesSolo: 3, defenseInterceptions: ri(n + 91, 0, 2), defensePassDeflections: ri(n + 92, 1, 3) }),
      P(8, 19, { kickFieldGoalsMade: ri(n + 93, 0, 3), kickFieldGoalAttempts: 3, kickFieldGoalLong: ri(n + 94, 30, 52), kickXPMade: 3, kickXPAttempts: 3 }),
      P(9, 20, { punts: ri(n + 95, 2, 6), puntYards: 180, puntsAverage: 44.2, puntsDownIn20: ri(n + 96, 0, 3), puntsLong: 55 })];
  };
  return { Home: { Name: g.home.team, Abbrev: initials(g.home.team), Score: g.home.score, Quarters: quarters(g.home.score, 1), Stats: teamStats(g.home, 1) },
           Away: { Name: g.away.team, Abbrev: initials(g.away.team), Score: g.away.score, Quarters: quarters(g.away.score, 2), Stats: teamStats(g.away, 200) },
           Players: [...players(g.away, 2), ...players(g.home, 5)],
           Positions: ["QB","HB","FB","WR","TE","LT","LG","C","RG","RT","LEDG","REDG","DT","SAM","MIKE","WILL","CB","FS","SS","K","P"] };
}
