<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PirateFlag Sports · Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#cc0000; --red-dark:#a30000;
  --nav:#000000; --nav-2:#1d1e1f; --nav-text:#ffffff; --nav-dim:#a5a6a7;
  --bg:#edeef0; --card:#ffffff; --line:#dcdddf; --line-2:#f1f2f3;
  --text:#121213; --dim:#6c6d6f; --win:#121213; --lose:#9a9b9d;
  --head:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151617; --card:#1f2022; --line:#303235; --line-2:#26282a;
    --text:#ededee; --dim:#9a9b9e; --win:#ffffff; --lose:#7d7e81;
  }
}
:root[data-theme="dark"]{
  --bg:#151617; --card:#1f2022; --line:#303235; --line-2:#26282a;
  --text:#ededee; --dim:#9a9b9e; --win:#ffffff; --lose:#7d7e81;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--body)}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- Top nav ---------- */
.nav{background:var(--nav);color:var(--nav-text);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:30}
.nav-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;height:56px;padding:0 16px;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 22px/1 var(--head);letter-spacing:-.5px;font-style:italic;white-space:nowrap}
.brand-mark{background:var(--red);color:#fff;padding:5px 7px 4px;transform:skewX(-12deg);display:inline-block}
.brand-mark span{display:inline-block;transform:skewX(12deg)}
@media (max-width:560px){#brandName{display:none}.nav-in{gap:10px}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--nav-dim);text-decoration:none;font:700 14px/56px var(--head);padding:0 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}

/* ---------- Scoreboard strip ---------- */
.strip{background:var(--card);border-bottom:1px solid var(--line)}
.strip-in{max-width:1280px;margin:0 auto;display:flex;align-items:stretch}
.strip-label{flex:none;display:flex;flex-direction:column;justify-content:center;padding:8px 16px;border-right:1px solid var(--line);font:700 13px/1.2 var(--head)}
.strip-label small{font:500 11px var(--body);color:var(--dim)}
.strip-games{display:flex;overflow-x:auto;scroll-snap-type:x proximity}
.sb{flex:none;width:176px;padding:8px 12px;border-right:1px solid var(--line);scroll-snap-align:start;text-decoration:none;cursor:default}
.sb-status{font:700 11px var(--body);color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between}
.sb-status .uvu{color:var(--red)}
.sb-row{display:flex;align-items:center;gap:6px;font-size:13px;line-height:22px}
.sb-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-row .sc{font-weight:700;min-width:20px;text-align:right}
.sb-row.lost{color:var(--lose)}
.sb-row.won{color:var(--win);font-weight:700}
.rk{font-size:10px;color:var(--dim);font-weight:500;margin-right:2px}

/* ---------- Layout ---------- */
.demo{background:#fff4d6;color:#5c4400;text-align:center;font-size:12px;padding:6px 12px;border-bottom:1px solid #f0dca0}
main{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr) 300px}.col-left{order:3;grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.col-left{order:2}.col-right{order:3}}
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:16px}
.card-h{font:700 16px/1.2 var(--head);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;margin:0}
.card-h small{font:500 12px var(--body);color:var(--dim)}
.empty{padding:16px 14px;color:var(--dim);font-size:13px}

/* ---------- Team badge ---------- */
.tb{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 9px/1 var(--head);letter-spacing:-.2px}
.tb.lg{width:64px;height:64px;font-size:22px}

/* ---------- Hero (game of the week) ---------- */
.hero{background:var(--nav-2);color:#fff;border:0}
.hero-tag{background:var(--red);font:800 12px/1 var(--head);padding:7px 14px;font-style:italic;letter-spacing:.2px}
.hero-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:26px 18px 18px}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero-team .n{font:800 22px/1.05 var(--head)}
.hero-team .u{font-size:12px;color:var(--nav-dim)}
.hero-team.lost .n{color:var(--nav-dim)}
.hero-score{font:800 54px/1 var(--head);display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums}
.hero-score .l{color:#6f7073}
.hero-score .f{font:700 12px var(--body);color:var(--nav-dim);display:block;text-align:center;margin-top:6px}
.hero-line{font:700 26px/1.1 var(--head);padding:4px 18px 20px;margin:0}
@media (max-width:520px){.hero-score{font-size:38px;gap:10px}.hero-team .n{font-size:17px}.tb.lg{width:48px;height:48px;font-size:17px}.hero-line{font-size:21px}}

/* ---------- Headlines ---------- */
.hl{list-style:none;margin:0;padding:0}
.hl li{padding:12px 14px;border-top:1px solid var(--line-2)}
.hl li:first-child{border-top:0}
.hl .t{font:700 17px/1.2 var(--head);display:block}
.hl .s{color:var(--dim);font-size:13px;margin-top:3px}
.flag{display:inline-block;font:800 11px/1 var(--head);color:#fff;background:var(--red);padding:3px 5px 2px;margin-right:6px;vertical-align:2px;font-style:italic}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 11px var(--body);color:var(--dim);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 10px;border-top:1px solid var(--line-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.user td{background:color-mix(in srgb,var(--red) 6%,transparent)}
.team-cell{display:flex;align-items:center;gap:8px}
.team-cell .nm{font-weight:500}
.num{color:var(--dim);width:22px;display:inline-block;text-align:right;margin-right:4px;font-weight:700}
.scroll{overflow-x:auto}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}

/* ---------- Lists ---------- */
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line-2)}
.lst li:first-child{border-top:0}
.lst .r{font:800 20px/1 var(--head);color:var(--dim);width:20px;flex:none}
.lst .main{flex:1;min-width:0}
.lst .a{font-weight:700}
.lst .b{font-size:12px;color:var(--dim)}
.mv{font-size:11px;font-weight:700}
.mv.up{color:#0a8a3c}.mv.dn{color:var(--red)}
.kind{font:700 10px/1 var(--body);padding:3px 5px;border-radius:3px;flex:none;margin-top:2px;color:#fff}
.k-commit{background:#0a8a3c}.k-flip{background:#c26a00}.k-decommit{background:var(--red)}.k-sign{background:#2456b3}
.stars{color:#e0a800;letter-spacing:-1px}

/* ---------- Scores page ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:14px}
.g{border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.g .sb-row{font-size:14px;line-height:26px}
.g-meta{font-size:11px;color:var(--dim);margin-top:4px}

footer{max-width:1280px;margin:0 auto;padding:8px 16px 32px;color:var(--dim);font-size:12px}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="#home"><span class="brand-mark"><span id="brandShort">PF</span></span><span id="brandName">PirateFlag Sports</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#home">Home</a>
      <a href="#scores">Scores</a>
      <a href="#standings">Standings</a>
      <a href="#recruiting">Recruiting</a>
    </nav>
  </div>
</header>

<div class="strip" aria-label="Scoreboard"><div class="strip-in" id="strip"></div></div>
<div id="demo"></div>
<main id="view"><div class="empty">Loading the dynasty…</div></main>
<footer id="foot"></footer>

<script>
/* =========================================================
   CONFIG — the only part you need to edit
   API_BASE: your Cloudflare Worker URL (no trailing slash).
   Leave it empty to preview the site with sample data.
   ========================================================= */
const CONFIG = {
  API_BASE: "https://dynasty-proxy.jw1388954.workers.dev",                 // e.g. "https://dynasty-proxy.yourname.workers.dev"
  SITE_NAME: "PirateFlag Sports",
  SITE_SHORT: "PF"
};

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = (n = "") => { const w = n.replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean); return (w.length > 1 ? w.map((x) => x[0]).join("") : (w[0] || "?").slice(0, 3)).slice(0, 3).toUpperCase(); };
const hue = (n = "") => { let h = 2166136261; for (const c of n) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h % 360; };
const badge = (name, lg) => `<span class="tb${lg ? " lg" : ""}" style="background:hsl(${hue(name)} 55% 34%)" aria-hidden="true">${esc(initials(name))}</span>`;
const rk = (r) => (r > 0 ? `<span class="rk">${r}</span>` : "");
const parseRec = (s = "0-0") => { const [w, l] = String(s).split("-").map(Number); return { w: w || 0, l: l || 0 }; };
const stars = (n) => `<span class="stars" aria-label="${n} stars">${"★".repeat(n || 0)}</span>`;

let D = {};          // all loaded data
let isDemo = false;

async function api(path) {
  const r = await fetch(CONFIG.API_BASE.replace(/\/$/, "") + "/v1" + path);
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

async function load() {
  if (!CONFIG.API_BASE) { isDemo = true; D = SAMPLE; return; }
  const want = {
    league: "/league", schedule: "/schedule", standings: "/standings",
    heisman: "/awards/heisman", commits: "/recruits/commits", classes: "/recruits/classes"
  };
  const keys = Object.keys(want);
  const res = await Promise.allSettled(keys.map((k) => api(want[k])));
  res.forEach((r, i) => {
    D[keys[i]] = r.status === "fulfilled" ? r.value : null;
    if (r.status === "rejected") console.warn(r.reason);
  });
}

/* ---------- derived data ---------- */
const games = () => D.schedule?.data || [];
const standings = () => D.standings?.data || [];
const teamRec = (key) => standings().find((t) => t.team_key === key)?.record;
const weeks = () => [...new Set(games().map((g) => g.week))].sort((a, b) => a - b);
const latestPlayedWeek = () => { const p = games().filter((g) => g.played).map((g) => g.week); return p.length ? Math.max(...p) : weeks()[0]; };
function weekLabel(w) {
  const g = games().find((x) => x.week === w);
  if (!g) return `Week ${w}`;
  if (g.bowl_name) return g.bowl_name;
  const d = String(g.displayed_week ?? "").trim();
  return /^\d+$/.test(d) ? `Week ${d}` : d || `Week ${w}`;
}
const kindOrder = { user_vs_user: 0, user_vs_cpu: 1, cpu_vs_cpu: 2 };
const rankWeight = (g) => (g.home.rank_at_game || 40) + (g.away.rank_at_game || 40);
const sortGames = (list) => [...list].sort((a, b) => (kindOrder[a.kind] - kindOrder[b.kind]) || (rankWeight(a) - rankWeight(b)));
const coach = (side) => (side.user_id > 0 || (side.user_name && side.user_id !== -1) ? side.user_name : "");

function winnerLoser(g) {
  const homeWon = g.home.score > g.away.score;
  return homeWon ? [g.home, g.away] : [g.away, g.home];
}
function headline(g) {
  const [w, l] = winnerLoser(g);
  const m = w.score - l.score;
  const verb = m <= 3 ? "edges" : m <= 8 ? "holds off" : m <= 16 ? "beats" : m <= 27 ? "rolls past" : "routs";
  const upset = l.rank_at_game > 0 && (!w.rank_at_game || w.rank_at_game > l.rank_at_game);
  const wn = (w.rank_at_game ? `No. ${w.rank_at_game} ` : "") + w.team;
  const ln = (l.rank_at_game ? `No. ${l.rank_at_game} ` : "") + l.team;
  return { upset, text: `${wn} ${verb} ${ln}, ${w.score}–${l.score}`, w, l };
}

/* ---------- scoreboard strip ---------- */
function sbRow(side, other, played) {
  const cls = !played ? "" : side.score > other.score ? "won" : "lost";
  return `<div class="sb-row ${cls}">${badge(side.team)}<span class="nm">${rk(side.rank_at_game)}${esc(side.team)}</span><span class="sc">${played ? side.score : ""}</span></div>`;
}
function renderStrip() {
  const w = latestPlayedWeek();
  const list = sortGames(games().filter((g) => g.week === w && g.kind !== "cpu_vs_cpu"));
  const fill = list.length ? list : sortGames(games().filter((g) => g.week === w)).slice(0, 12);
  $("#strip").innerHTML = `
    <div class="strip-label">${esc(weekLabel(w))}<small>${esc(D.league?.data?.season_text || "")}</small></div>
    <div class="strip-games">${fill.map((g) => `
      <div class="sb">
        <div class="sb-status"><span>${g.played ? "Final" : esc(g.date || "Upcoming")}</span>${g.kind === "user_vs_user" ? '<span class="uvu">H2H</span>' : ""}</div>
        ${sbRow(g.away, g.home, g.played)}${sbRow(g.home, g.away, g.played)}
      </div>`).join("") || '<div class="empty">No games synced yet.</div>'}
    </div>`;
}

/* ---------- home ---------- */
function heroCard(g) {
  if (!g) return "";
  const [w] = winnerLoser(g);
  const h = headline(g);
  const side = (s) => `<div class="hero-team ${g.played && s !== w ? "lost" : ""}">${badge(s.team, true)}
      <div class="n">${rk(s.rank_at_game)}${esc(s.team)}</div><div class="u">${esc(coach(s) || "CPU")}${teamRec(s.team_key) ? " · " + esc(teamRec(s.team_key)) : ""}</div></div>`;
  return `<section class="card hero">
    <div class="hero-tag">${g.kind === "user_vs_user" ? "Game of the Week" : "Top result"}</div>
    <div class="hero-body">${side(g.away)}
      <div><div class="hero-score"><span class="${g.away === w ? "" : "l"}">${g.away.score}</span><span class="${g.home === w ? "" : "l"}">${g.home.score}</span></div><span class="f">Final</span></div>
      ${side(g.home)}</div>
    <h1 class="hero-line">${h.upset ? '<span class="flag">UPSET</span>' : ""}${esc(h.text)}</h1>
  </section>`;
}

function renderHome() {
  const w = latestPlayedWeek();
  const played = sortGames(games().filter((g) => g.week === w && g.played));
  const userGames = played.filter((g) => g.kind !== "cpu_vs_cpu");
  const top = userGames[0] || played[0];
  const rest = (userGames.length ? userGames : played).filter((g) => g !== top);
  // also surface CPU upsets of ranked teams
  const cpuUpsets = played.filter((g) => g.kind === "cpu_vs_cpu" && headline(g).upset);

  const heads = [...rest, ...cpuUpsets].map((g) => {
    const h = headline(g);
    const wc = coach(h.w), lc = coach(h.l);
    const sub = [wc && `${wc} moves to ${teamRec(h.w.team_key) || "—"}`, lc && `${lc} falls to ${teamRec(h.l.team_key) || "—"}`].filter(Boolean).join("; ");
    return `<li><span class="t">${h.upset ? '<span class="flag">UPSET</span>' : ""}${esc(h.text)}</span>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</li>`;
  }).join("");

  $("#view").innerHTML = `<div class="grid">
    <div class="col-left">${top25Card()}</div>
    <div class="col-main">
      ${heroCard(top) || '<div class="card"><div class="empty">No games played yet this season. Results show here after the first synced week.</div></div>'}
      <section class="card"><h2 class="card-h">Top headlines <small>${esc(weekLabel(w))}</small></h2>
        ${heads ? `<ul class="hl">${heads}</ul>` : '<div class="empty">Headlines appear once league games are played.</div>'}</section>
      ${upcomingCard()}
    </div>
    <div class="col-right">${heismanCard()}${commitsCard(6)}</div>
  </div>`;
}

function top25Card() {
  const t = standings().filter((s) => s.rank > 0).sort((a, b) => a.rank - b.rank).slice(0, 25);
  return `<section class="card"><h2 class="card-h">Top 25</h2>
    ${t.length ? `<table class="tbl"><tbody>${t.map((s) => `<tr class="${s.user_controlled ? "user" : ""}">
      <td><div class="team-cell"><span class="num">${s.rank}</span>${badge(s.name)}<span class="nm">${esc(s.name)}</span></div></td>
      <td>${esc(s.record)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Poll not synced yet.</div>'}</section>`;
}

function upcomingCard() {
  const next = games().filter((g) => !g.played && g.kind !== "cpu_vs_cpu");
  if (!next.length) return "";
  const w = Math.min(...next.map((g) => g.week));
  const list = sortGames(next.filter((g) => g.week === w));
  return `<section class="card"><h2 class="card-h">On deck <small>${esc(weekLabel(w))}</small></h2><ul class="hl">${list.map((g) => `
    <li><span class="t">${rk(g.away.rank_at_game)}${esc(g.away.team)} at ${rk(g.home.rank_at_game)}${esc(g.home.team)}</span>
    <div class="s">${esc([coach(g.away) || "CPU", coach(g.home) || "CPU"].join(" vs "))}${g.kind === "user_vs_user" ? " · head-to-head" : ""}</div></li>`).join("")}</ul></section>`;
}

function heismanCard() {
  const h = D.heisman?.data || [];
  return `<section class="card"><h2 class="card-h">Heisman watch</h2>
    ${h.length ? `<ul class="lst">${h.map((p) => {
      const mv = p.new ? '<span class="mv up">NEW</span>' : p.movement > 0 ? `<span class="mv up">▲${p.movement}</span>` : p.movement < 0 ? `<span class="mv dn">▼${-p.movement}</span>` : "";
      return `<li><span class="r">${p.rank}</span><div class="main"><div class="a">${esc(p.name)} ${mv}</div>
        <div class="b">${esc(p.position)} · ${esc(p.class_year)} · ${p.team_rank ? "No. " + p.team_rank + " " : ""}${esc(p.team_name)}</div>
        <div class="b">${esc(p.stat_line)}</div></div></li>`;
    }).join("")}</ul>` : '<div class="empty">Heisman watch not synced yet.</div>'}</section>`;
}

function commitLabel(c) {
  if (c.kind === "commit" && c.previous_school) return ["Flip", "k-flip"];
  return { commit: ["Commit", "k-commit"], decommit: ["Decommit", "k-decommit"], sign: ["Signed", "k-sign"] }[c.kind] || [c.kind, "k-commit"];
}
function commitsCard(limit) {
  const c = (D.commits?.data || []).slice(0, limit || 50);
  return `<section class="card"><h2 class="card-h">Recruiting wire</h2>
    ${c.length ? `<ul class="lst">${c.map((x) => {
      const [lbl, cls] = commitLabel(x);
      const dest = x.kind === "decommit" ? `leaves ${esc(x.previous_school)}` : x.previous_school ? `${esc(x.previous_school)} → ${esc(x.school?.name)}` : esc(x.school?.name);
      return `<li><span class="kind ${cls}">${lbl}</span><div class="main"><div class="a">${esc(x.name)} ${stars(x.stars)}</div>
        <div class="b">${esc(x.position)} · No. ${x.national_rank} overall · ${dest}</div></div></li>`;
    }).join("")}</ul>` : '<div class="empty">No commitment changes since the first recruiting sync.</div>'}</section>`;
}

/* ---------- scores ---------- */
let scoresWeek = null, scoresFilter = "user";
function renderScores() {
  const ws = weeks();
  if (scoresWeek === null || !ws.includes(scoresWeek)) scoresWeek = latestPlayedWeek();
  let list = games().filter((g) => g.week === scoresWeek);
  if (scoresFilter === "user") list = list.filter((g) => g.kind !== "cpu_vs_cpu");
  list = sortGames(list);
  $("#view").innerHTML = `<section class="card"><h2 class="card-h">Scores <small>${esc(D.schedule?.season || "")}</small></h2>
    <div class="ctrl">${ws.map((w) => `<button class="pill" data-week="${w}" aria-pressed="${w === scoresWeek}">${esc(weekLabel(w))}</button>`).join("")}</div>
    <div class="ctrl"><button class="pill" data-f="user" aria-pressed="${scoresFilter === "user"}">League games</button><button class="pill" data-f="all" aria-pressed="${scoresFilter === "all"}">All FBS</button></div>
    ${list.length ? `<div class="games">${list.map((g) => `<div class="g">
      <div class="sb-status"><span>${g.played ? "Final" : esc(g.date || "Upcoming")}</span>${g.kind === "user_vs_user" ? '<span class="uvu">H2H</span>' : ""}</div>
      ${sbRow(g.away, g.home, g.played)}${sbRow(g.home, g.away, g.played)}
      <div class="g-meta">${esc([coach(g.away), coach(g.home)].filter(Boolean).join(" vs ") || "CPU vs CPU")}</div></div>`).join("")}</div>`
      : '<div class="empty">No games this week for this filter. Try All FBS.</div>'}</section>`;
  document.querySelectorAll("[data-week]").forEach((b) => b.onclick = () => { scoresWeek = +b.dataset.week; renderScores(); });
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { scoresFilter = b.dataset.f; renderScores(); });
}

/* ---------- standings ---------- */
let standingsUsersOnly = false;
function renderStandings() {
  const byConf = {};
  for (const t of standings()) (byConf[t.conference || "Independent"] ||= []).push(t);
  const confs = Object.keys(byConf).sort().filter((c) => !standingsUsersOnly || byConf[c].some((t) => t.user_controlled));
  const sortConf = (a, b) => { const A = parseRec(a.conference_record), B = parseRec(b.conference_record); return (B.w - B.l) - (A.w - A.l) || b.wins - a.wins || a.losses - b.losses; };
  $("#view").innerHTML = `
    <div class="card"><div class="ctrl" style="border:0"><button class="pill" id="uo" aria-pressed="${standingsUsersOnly}">Conferences with league coaches</button></div></div>
    ${confs.map((c) => `<section class="card"><h2 class="card-h">${esc(c)}</h2><div class="scroll"><table class="tbl">
      <thead><tr><th>Team</th><th>Conf</th><th>Overall</th><th>PF</th><th>PA</th><th>OVR</th><th>OFF</th><th>DEF</th></tr></thead>
      <tbody>${byConf[c].sort(sortConf).map((t) => `<tr class="${t.user_controlled ? "user" : ""}">
        <td><div class="team-cell">${badge(t.name)}<span class="nm">${rk(t.rank)}${esc(t.name)}</span></div></td>
        <td>${esc(t.conference_record)}</td><td>${esc(t.record)}</td><td>${t.points_for ?? ""}</td><td>${t.points_against ?? ""}</td>
        <td>${t.overall ?? ""}</td><td>${t.offense ?? ""}</td><td>${t.defense ?? ""}</td></tr>`).join("")}</tbody></table></div></section>`).join("")
      || '<div class="card"><div class="empty">Standings not synced yet.</div></div>'}`;
  $("#uo").onclick = () => { standingsUsersOnly = !standingsUsersOnly; renderStandings(); };
}

/* ---------- recruiting ---------- */
function renderRecruiting() {
  const cl = (D.classes?.data || []).slice(0, 25);
  $("#view").innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,1fr) 340px">
    <section class="card"><h2 class="card-h">Top classes</h2>
      ${cl.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Team</th><th>Pts</th><th>5★</th><th>4★</th><th>3★</th><th>Total</th></tr></thead><tbody>
      ${cl.map((c) => `<tr class="${c.user_team ? "user" : ""}"><td><div class="team-cell"><span class="num">${c.rank}</span>${badge(c.name)}<span class="nm">${esc(c.name)}</span></div></td>
        <td>${c.points != null ? Number(c.points).toFixed(1) : ""}</td><td>${c.commits?.five_star ?? 0}</td><td>${c.commits?.four_star ?? 0}</td><td>${c.commits?.three_star ?? 0}</td><td><b>${c.commits?.total ?? 0}</b></td></tr>`).join("")}
      </tbody></table></div>` : '<div class="empty">Class rankings not synced yet.</div>'}</section>
    <div>${commitsCard(40)}</div></div>`;
}

/* ---------- router ---------- */
const ROUTES = { home: renderHome, scores: renderScores, standings: renderStandings, recruiting: renderRecruiting };
function route() {
  const name = location.hash.slice(1);
  const key = ROUTES[name] ? name : "home";
  document.querySelectorAll(".tabs a").forEach((a) => a.getAttribute("href") === "#" + key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  ROUTES[key]();
  window.scrollTo(0, 0);
}

async function init() {
  $("#brandName").textContent = CONFIG.SITE_NAME;
  $("#brandShort").textContent = CONFIG.SITE_SHORT;
  try { await load(); } catch (e) { console.error(e); }
  if (isDemo) $("#demo").innerHTML = '<div class="demo">Showing sample data. Set API_BASE in the CONFIG block to load your dynasty.</div>';
  else if (!D.schedule) $("#demo").innerHTML = '<div class="demo">Couldn’t reach the data proxy. Check API_BASE and that the Worker’s DYNASTY_KEY secret is set.</div>';
  const lg = D.league?.data;
  document.title = `${CONFIG.SITE_NAME} · ${lg?.name || "Dynasty"}`;
  $("#foot").textContent = [lg?.name, lg?.last_sync_at && `Last synced ${new Date(lg.last_sync_at).toLocaleString()}`, "Fan-made league site. Not affiliated with ESPN or EA Sports."].filter(Boolean).join(" · ");
  renderStrip();
  route();
}
window.addEventListener("hashchange", route);
